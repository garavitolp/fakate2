  }
  // Reparte los bloques en páginas sin cortar tarjetas
  function buildViewerPages() {
    const px = VIEWER.size * (IMG_W / 390), maxW = IMG_W - IMG_PAD * 2;
    const headH = px * 1.45, bodyH = IMG_H - IMG_PAD * 2 - headH;
    const list = viewerCards();
    const catIdx = cat => { const i = STATE.categories.indexOf(cat); return i < 0 ? 999 : i; };
    const sections = [];   // [{ title, sub, cards }]
    if (VIEWER.group === 'PROV') {
      const g = {};
      list.forEach(c => { (g[c.provider || ''] = g[c.provider || ''] || []).push(c); });
      Object.keys(g).sort((a, b) => (a === '') - (b === '') || provText(a).localeCompare(provText(b))).forEach(k => {
        const p = STATE.providers[k];
        sections.push({ title: k ? (p ? p.nombre : k) : 'SIN PROVEEDOR', sub: p ? [p.direccion, p.whatsapp ? 'Tel ' + p.whatsapp : ''].filter(Boolean).join(' · ') : '',
          cards: g[k].sort((a, b) => catIdx(a.category) - catIdx(b.category) || cardTitle(a).localeCompare(cardTitle(b))), prov: false });
      });
    } else {
      [...new Set(list.map(c => c.category))].sort((a, b) => catIdx(a) - catIdx(b)).forEach(cat => {
        sections.push({ title: cat, sub: '', cards: list.filter(c => c.category === cat).sort((a, b) => cardTitle(a).localeCompare(cardTitle(b))), prov: true });
      });
    }
    const pages = [];
    let page = null, used = 0;
    const newPage = () => { page = { items: [] }; pages.push(page); used = 0; };
    const place = (rows, meta) => { page.items.push(Object.assign({ rows, y: used }, meta)); used += rows.reduce((s, r) => s + r.h, 0); };
    newPage();
    sections.forEach(sec => {
      const hdr = () => groupBlock(sec.title, sec.sub, px, maxW), hdrMore = () => groupBlock(sec.title + ' (sigue)', '', px, maxW, true);
      let first = true;
      sec.cards.forEach(c => {
        const cb = cardBlock(c, sec.prov, px, maxW), gb = first ? hdr() : null;
        const need = cb.h + (gb ? gb.h : 0);
        if (used + need > bodyH && used > 0) { newPage(); if (!first) { const m = hdrMore(); place(m.rows, { kind: 'group' }); } }
        if (gb) place(gb.rows, { kind: 'group' });
        first = false;
        if (used + cb.h <= bodyH) { place(cb.rows, { kind: 'card', id: cb.id, sku: cb.sku }); return; }

            newPage(); const m = hdrMore(); place(m.rows, { kind: 'group' });
          }
          chunk.push(r); chunkH += r.h;
        });
        if (chunk.length) place(chunk, { kind: 'card', id: cb.id, sku: cb.sku, split: ++part });

  }
  function drawViewerPage(pg, n, total, px, headH) {
    const cv = document.createElement('canvas'); cv.width = IMG_W; cv.height = IMG_H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, IMG_W, IMG_H);
    const neg = STATE.config.NOMBRE_NEGOCIO || 'FAKATE', fecha = shortDate(new Date().toISOString()), num = total > 1 ? `${n}/${total}` : '';
    const hp = px * 0.78;
    // fecha chica y gris; número de imagen apenas más grande y más oscuro
    ctx.font = fontOf(px * 0.62, 800); const nw = num ? ctx.measureText(num).width : 0;
    ctx.fillStyle = '#555'; if (num) ctx.fillText(num, IMG_W - IMG_PAD - nw, IMG_PAD + hp);
    ctx.font = fontOf(px * 0.5, 600); const fw = ctx.measureText(fecha).width, gap = num ? px * 0.45 : 0;
    ctx.fillStyle = '#888'; ctx.fillText(fecha, IMG_W - IMG_PAD - nw - gap - fw, IMG_PAD + hp);

    ctx.font = fontOf(hp, 800); ctx.fillStyle = '#333';
    let left = neg + ' · Lista de compras';
    while (ctx.measureText(left).width > IMG_W - IMG_PAD * 2 - rw - hp && left.length > 4) left = left.slice(0, -2) + '…';
    ctx.fillText(left, IMG_PAD, IMG_PAD + hp);
    ctx.fillStyle = '#000'; ctx.fillRect(IMG_PAD, IMG_PAD + hp * 1.45, IMG_W - IMG_PAD * 2, Math.max(3, px * 0.07));

  }
  function renderViewer() {
    const box = $('viewer');

    const { pages, px, headH } = buildViewerPages();
    VIEWER.pages = pages.map(p => p.items.filter(i => i.kind === 'card').map(i => i.sku + (i.split ? '#' + i.split : '')));
    VIEWER.canvases = pages.map((p, i) => drawViewerPage(p, i + 1, pages.length, px, headH));

  }
  function viewerFiles() {

  /* ---------- 9. MODO / PANEL ---------- */
  function setMode(mode) {

  /* ---------- 10. EVENTOS (delegados: no hay onclick con texto incrustado) ---------- */
  async function handleAction(act, el) {

      case 'toggle-panel': setPanelVisible(!STATE.panelVisible); break;
      case 'save-manual': saveManual(); break;
      case 'cancel-edit': manualDraft = newDraft('manual'); renderDraft(manualDraft); renderList(); break;
      case 'pick-photo': $('camera-input').click(); break;
      case 'demo-photo': loadDemoPhoto(); break;
      case 'confirm-photo': confirmPhoto(); break;

      case 'm-save': saveMin(false); break;
      case 'm-save-next': saveMin(true); break;
      case 'm-reset': {
        if (minHasData(minDraft) && !(await askConfirm('¿Limpiar todo lo que armaste en esta pantalla?', 'Sí, limpiar', 'Volver'))) break;
        minDraft = newMinDraft(); renderDraft(minDraft); break;
      }
      case 'm-pick-sku': { d.sku = el.dataset.v; showSug(d.id + '-skusug', ''); await applyMinSku(d); break; }
      case 'm-pick-copy': copyFromProduct(d, el.dataset.v); break;
      case 'm-pick-prov': addMinProv(d, el.dataset.v); break;
      case 'm-add-prov': { const inp = $(d.id + '-provin'); addMinProv(d, inp ? inp.value : ''); break; }
      case 'm-pred': d.provPred = el.dataset.v; renderDraft(d); break;
      case 'm-rm-prov': d.proveedores = d.proveedores.filter(x => x !== el.dataset.v); if (d.provPred === el.dataset.v) d.provPred = d.proveedores[0] || ''; renderDraft(d); break;
      case 'm-toggle-varios': d.colors = d.colors.includes(VARIOS) ? d.colors.filter(x => x !== VARIOS) : d.colors.concat(VARIOS); renderDraft(d); break;
      case 'm-preset': { const [a, b, s] = el.dataset.v.split('-'); addMinRange(d, a, b, s); break; }
      case 'm-range-add': addMinRange(d, d.rFrom, d.rTo, d.rStep); break;
      case 'm-clear-sizes': d.sizes = []; renderDraft(d); break;

      case 'toggle-size': {
        const t = el.dataset.v;
        d.sizes = d.sizes.includes(t) ? d.sizes.filter(x => x !== t) : d.sizes.concat(t);
        renderDraft(d); break;
      }
      case 'add-size': {
        const inp = $(d.id + '-sizein'), t = normSize(inp.value);
        if (t && !d.sizes.includes(t)) d.sizes.push(t);
        inp.value = ''; renderDraft(d); break;
      }
      case 'toggle-color': {
        const c = el.dataset.v;
        d.colors = d.colors.includes(c) ? d.colors.filter(x => x !== c) : d.colors.concat(c);
        renderDraft(d); break;
      }
      case 'add-color': {
        const inp = $(d.id + '-colorin');
        addColorToDraft(d, inp.value);
        inp.value = ''; renderDraft(d); break;
      }
      case 'color-sim-yes': {
        const s = d.pendingColor.similar;
        if (!d.colors.includes(s)) d.colors.push(s);
        d.pendingColor = null; renderDraft(d); break;
      }
      case 'color-sim-no': {
        const v = d.pendingColor.value;
        if (!STATE.colorCatalog.includes(v)) STATE.colorCatalog.push(v);
        if (!d.colors.includes(v)) d.colors.push(v);
        d.pendingColor = null; renderDraft(d); break;
      }
      case 'add-tag': {
        const inp = $(d.id + '-tagin'), t = normText(inp.value).replace(/^#/, '');
        if (t && !d.tags.includes(t)) d.tags.push(t);
        inp.value = ''; renderDraft(d); break;
      }
      case 'rm-tag': d.tags = d.tags.filter(t => t !== el.dataset.v); renderDraft(d); break;

      case 'step': {
        const k = key(el.dataset.t, el.dataset.c), cur = d.qty[k];
        const n = Math.max(0, (typeof cur === 'number' ? cur : 0) + Number(el.dataset.delta));
        d.qty[k] = n;
        const inp = el.parentElement.querySelector('input[data-cell]');
        inp.value = n; inp.className = cellClass(n);
        updateLive(d); break;
      }
      case 'quickn': {
        d.quickN = Math.max(0, (d.quickN || 0) + Number(el.dataset.delta));
        $(d.id + '-n').value = d.quickN; break;
      }
      case 'fill-row': d.colors.forEach(c => { d.qty[key(el.dataset.t, c)] = d.quickN; }); renderDraft(d); break;
      case 'fill-col': d.sizes.forEach(t => { d.qty[key(t, el.dataset.c)] = d.quickN; }); renderDraft(d); break;
      case 'copy-first-row': {
        const sizes = sortSizes(d.sizes); // orden VISUAL, no el orden de los clics
        if (sizes.length < 2) break;
        sizes.slice(1).forEach(t => d.colors.forEach(c => {
          const v = d.qty[key(sizes[0], c)];
          if (v === undefined) delete d.qty[key(t, c)]; else d.qty[key(t, c)] = v;
        }));
        renderDraft(d); break;
      }
      case 'clear-grid': d.qty = {}; renderDraft(d); break;
      case 'fullscreen': d.fullscreen = !d.fullscreen; renderDraft(d); break;
      case 'repeat-last': {
        const s = STATE.lastStructure;
        if (!s) { toast('Todavía no hay una carga anterior', 'info'); break; }
        d.sizes = union(d.sizes, s.sizes); d.colors = union(d.colors, s.colors); d.tags = union(d.tags, s.tags);
        renderDraft(d); toast('Talles, colores y etiquetas de la última carga', 'info'); break;
      }

      case 'set-field': {
        const f = el.dataset.f, v = el.dataset.v;
        d[f] = v;
        renderDraft(d); break;
      }
      case 'other-open': { d.askOther = true; renderDraft(d); const i = $(d.id + '-otherin'); if (i) i.focus(); break; }
      case 'other-cancel': d.askOther = false; renderDraft(d); break;
      case 'other-add': {
        const raw = normText($(d.id + '-otherin').value);
        if (!raw) break;
        const all = union(STATE.users, STATE.extraNames);
        let name = all.find(u => normText(u) === raw);          // si ya existe, se usa tal cual está escrito
        if (!name) { name = titleCase(raw); STATE.extraNames.push(name); }
        d.hechaPor = name; d.askOther = false; renderDraft(d); break;
      }
      case 'pick-sku': {
        d.sku = el.dataset.v;
        if (d.origin === 'foto') d.skuConfirmed = false;
        applySku(d); renderDraft(d); break;
      }
      case 'pick-prov': {
        d.provider = el.dataset.v;
        showSug(d.id + '-provsug', '');
        const inp = $(d.id + '-provider'); if (inp) inp.value = d.provider;
        $(d.id + '-provinfo').innerHTML = provInfoHtml(d.provider);
        break;
      }
      case 'sku-accept': {
        d.sku = d.skuSuggestion.sku; applySku(d); d.skuConfirmed = true; renderDraft(d); break;
      }
      case 'sku-confirm': applySku(d); d.skuConfirmed = true; renderDraft(d); break;
      case 'discard-draft': {
        const ok = await askConfirm('¿Descartar este producto leído de la foto? No se va a ingresar.', 'Sí, descartar', 'Volver');
        if (!ok) break;
        photoDrafts = photoDrafts.filter(x => x !== d); renderPhoto(); break;
      }

      case 'global-view': STATE.viewMode = el.dataset.mode; STATE.cards.forEach(c => { c.groupBy = null; }); renderList(); break;
      case 'card-group': { const c = STATE.cards.find(x => x.id === cardId); c.groupBy = el.dataset.mode; renderList(); break; }
      case 'card-toggle': { const c = STATE.cards.find(x => x.id === cardId); c.view = c.view === 'FALTA' ? 'STOCK' : 'FALTA'; renderList(); break; }
      case 'card-edit': editCard(cardId); break;
      case 'card-delete': {
        if (STATE.busy) break;
        const res = await withBusy('Borrando…', () => Api.borrarTarjeta(cardId));
        if (!res.ok) { apiFailed(res, 'No se pudo borrar.'); break; }
        setCards(res.cards); renderList(); toast('Enviada a la papelera (se puede restaurar)', 'info'); break;
      }
      case 'lote-delete': {
        const c = STATE.cards.find(x => x.id === cardId);
        const lote = STATE.cards.filter(x => x.estado === 'ACTIVA' && x.loteId === c.loteId);
        const ok = await askConfirm(`¿Enviar a la papelera la carga completa?\nSon ${lote.length} productos cargados juntos por ${c.hechaPor} el ${fmtDate(c.createdAt)}.`, 'Sí, enviar a la papelera', 'Volver');
        if (!ok || STATE.busy) break;
        const res = await withBusy('Borrando…', () => Api.borrarCarga(c.loteId));
        if (!res.ok) { apiFailed(res, 'No se pudo borrar la carga.'); break; }
        setCards(res.cards); renderList(); toast(`${lote.length} productos enviados a la papelera`, 'info'); break;
      }
      case 'card-restore': {
        if (STATE.busy) break;
        const res = await withBusy('Restaurando…', () => Api.restaurarTarjeta(cardId));
        if (!res.ok) { apiFailed(res, 'No se pudo restaurar.'); break; }
        setCards(res.cards); renderList(); toast('Tarjeta restaurada'); break;
      }
      case 'trash-empty': {
        if (STATE.busy) break;
        const n = STATE.cards.filter(c => c.estado === 'PAPELERA').length;
        if (!n || !(await askConfirm(`¿Vaciar la papelera?\nSe borran para siempre ${n} tarjeta(s). No se puede deshacer.`, 'Sí, vaciar', 'Volver'))) break;
        const res = await withBusy('Vaciando…', () => Api.vaciarPapelera());
        if (!res.ok) { apiFailed(res, 'No se pudo vaciar la papelera.'); break; }
        setCards(res.cards); renderList(); toast('Papelera vaciada', 'info'); break;
      }
      case 'refresh': refreshAll(true); break;
      case 'logout': logout(); break;
      case 'login-pick': pickLoginName(el.dataset.name); break;
      case 'login-reload': showLogin(); break;
      case 'install': installApp(); break;
      case 'login-submit': submitLogin(); break;
      case 'login-back': showLoginNames(); break;
      case 'boot-retry': start(); break;
      case 'toggle-trash': STATE.showTrash = !STATE.showTrash; renderList(); break;
      case 'toggle-filters': $('filters-box').classList.toggle('hidden'); break;
      case 'print': printList(); break;
      case 'viewer-open': openViewer(); break;
      case 'viewer-close': closeViewer(); break;
      case 'viewer-size': VIEWER.size = Math.min(48, Math.max(14, VIEWER.size + Number(el.dataset.delta))); saveViewerPrefs(); renderViewer(); break;
      case 'viewer-group': VIEWER.group = el.dataset.v; saveViewerPrefs(); renderViewer(); break;
      case 'viewer-mode': STATE.viewMode = el.dataset.v; renderViewer(); break;
      case 'viewer-alts': VIEWER.alts = !VIEWER.alts; saveViewerPrefs(); renderViewer(); break;
      case 'viewer-share': shareViewer(); break;
      case 'viewer-save': saveViewerImages(); break;
    }
  }

  function onCellInput(el) {
    const d = getDraft(el.dataset.d), k = key(el.dataset.t, el.dataset.c);
    const s = el.value.trim();
    if (s === '') delete d.qty[k];
    else if (/^\d+$/.test(s)) d.qty[k] = parseInt(s, 10);
    else if (s === '-') d.qty[k] = 0;
    else d.qty[k] = el.value;
    el.className = cellClass(d.qty[k]);   // sin re-render: el foco no se pierde
    updateLive(d);
  }

  function onFieldInput(el) {
    const d = getDraft(el.dataset.d), f = el.dataset.field;
    if (!d) return;
    if (f === 'sku') {
      d.sku = el.value.toUpperCase();     // se guarda en MAYÚSCULAS, no solo se muestra
      if (d.origin === 'foto') d.skuConfirmed = false;
      showSug(d.id + '-skusug', sugListHtml(searchProducts(el.value).map(p => ({ v: p.sku, sub: p.nombre })), 'pick-sku', d.id));
      $(d.id + '-skuinfo').innerHTML = skuInfoHtml(d);
      updateLive(d);
    } else if (f === 'provider') {
      d.provider = el.value.toUpperCase();
      showSug(d.id + '-provsug', sugListHtml(searchProviders(el.value).map(p => ({ v: p.code, sub: [p.nombre !== p.code ? p.nombre : '', p.zonas.join(', ')].filter(Boolean).join(' · ') })), 'pick-prov', d.id));
      $(d.id + '-provinfo').innerHTML = provInfoHtml(d.provider);
    } else if (f === 'productName' || f === 'comment') d[f] = el.value;
    else if (f === 'quickN') d.quickN = parseInt(el.value, 10) || 0;
  }

  function onFieldChange(el) {
    const d = getDraft(el.dataset.d), f = el.dataset.field;
    if (!d) return;
    if (f === 'sku') {
      // Al salir del campo se busca el SKU. Pequeña demora para no "comerse" el toque en otro botón.
      setTimeout(() => { if (getDraft(d.id) === d) { applySku(d); renderDraft(d); } }, 200);
    } else if (f === 'provider') {
      d.provider = normText(el.value);
    }
  }
  // Al tocar una sugerencia no se pierde el foco del campo (si no, el toque no llega)
  document.addEventListener('pointerdown', e => { if (e.target.closest('[data-sug]')) e.preventDefault(); });
  document.addEventListener('mousedown', e => { if (e.target.closest('[data-sug]')) e.preventDefault(); });
  document.addEventListener('focusout', e => {
    const id = e.target && e.target.dataset && e.target.dataset.sugbox;
    if (id) setTimeout(() => showSug(id, ''), 150);
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) handleAction(el.dataset.act, el);
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.dataset.cell) onCellInput(el);
    else if (el.dataset.field) onFieldInput(el);
    else if (el.dataset.mfield) onMinField(el);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.mfield === 'sku') { const d = getDraft(el.dataset.d); if (d) setTimeout(() => { if (minDraft === d) applyMinSku(d); }, 200); }
    else if (el.dataset && el.dataset.field) onFieldChange(el);
    else if (el.dataset && el.dataset.filter) { STATE.filters[el.dataset.filter] = el.value; renderList(); }
    else if (el.id === 'camera-input') { toast('La lectura con IA se conecta en la Fase 3. Por ahora usá el ejemplo.', 'info'); el.value = ''; }
  });
  document.addEventListener('keydown', e => {
    const el = e.target;
    if (e.key === 'Enter' && el.dataset) {
      if (el.dataset.enter) { e.preventDefault(); handleAction(el.dataset.enter, el); }
      else if (el.dataset.field === 'sku' || el.dataset.field === 'provider' || el.dataset.mfield === 'sku') { e.preventDefault(); el.blur(); }
    }
    if (e.key === 'Escape' && VIEWER.open) { closeViewer(); return; }
    if (e.key === 'Escape') {
      [manualDraft, minDraft, ...photoDrafts].forEach(d => { if (d && d.fullscreen) { d.fullscreen = false; renderDraft(d); } });
    }
  });

  /* ---------- 11. SESIÓN, SINCRONIZACIÓN E INICIO ---------- */
  function showScreen(id, on) { const el = $(id); el.classList.toggle('hidden', !on); el.classList.toggle('flex', on); }
  function bootMsg(msg, retry) { $('boot-msg').textContent = msg; $('boot-retry').classList.toggle('hidden', !retry); showScreen('boot-screen', true); }

  // Combina la lista que manda el servidor con lo que es solo de pantalla (vista por color/talle de cada tarjeta)
  function setCards(list) {
    const prev = new Map(STATE.cards.map(c => [c.id, c]));
    STATE.cards = (list || []).map(c => {
      const o = prev.get(c.id);
      if (o) { c.groupBy = o.groupBy; if (o.view === 'STOCK' || o.view === 'FALTA') c.view = o.view; if (o.readName && !c.readName) c.readName = o.readName; }
      return c;
    });
    STATE.lastSync = Date.now();
  }
  async function withBusy(msg, fn) {
    STATE.busy = true; const bar = $('busy-bar'); bar.textContent = msg; bar.classList.remove('hidden');
    try { return await fn(); } finally { STATE.busy = false; bar.classList.add('hidden'); }
  }
  function apiFailed(res, fallback) {
    if (res.code === 'AUTH') { Store.clear(); STATE.token = ''; showLogin(res.error); return; }
    toast((res.error || fallback), 'error');
  }

  // Nombre del negocio y sucursal (pestaña Configuracion). Se recuerdan para mostrarlos al instante al abrir.
  function applyBrand(negocio, sucursal) {
    const b = { negocio: String(negocio || '').trim() || 'FAKATE', sucursal: String(sucursal || '').trim() };
    document.querySelectorAll('.brand-name').forEach(el => { el.textContent = b.negocio; });
    document.querySelectorAll('.brand-branch').forEach(el => { el.textContent = b.sucursal; el.classList.toggle('hidden', !b.sucursal); });
    document.querySelectorAll('.brand-branch-print').forEach(el => { el.textContent = b.sucursal ? '· ' + b.sucursal : ''; });
    document.title = b.negocio + (b.sucursal ? ' · ' + b.sucursal : '') + ' · Reposición';
    try { localStorage.setItem(BRAND_KEY, JSON.stringify(b)); } catch (e) { /* nada */ }
  }
  try { const b = JSON.parse(localStorage.getItem(BRAND_KEY) || 'null'); if (b) applyBrand(b.negocio, b.sucursal); } catch (e) { /* nada */ }

  async function showLogin(msg) {
    showScreen('boot-screen', false);
    $('login-hint').textContent = Api.mode() === 'local' ? 'Modo prueba: sirve cualquier PIN de 4 dígitos' : '';
    showLoginNames();
    $('login-msg').textContent = msg || ''; $('login-msg').className = 'mt-4 text-center text-sm font-bold min-h-[1.25rem] ' + (msg ? 'text-red-400' : '');
    showScreen('login-screen', true);
    $('login-names').innerHTML = '<div class="col-span-2 text-center text-xs text-slate-500 animate-pulse">Cargando…</div>';
    const r = await Api.listarUsuarios();
    if (!r.ok) { $('login-names').innerHTML = `<button type="button" data-act="login-reload" class="col-span-2 px-4 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-black text-sm">Reintentar</button>`; $('login-msg').textContent = r.error || 'No se pudo cargar la lista.'; $('login-msg').className = 'mt-4 text-center text-sm font-bold text-red-400'; return; }
    applyBrand(r.negocio, r.sucursal);
    $('login-names').innerHTML = r.usuarios.map(u => `<button type="button" data-act="login-pick" data-name="${esc(u)}" class="px-4 py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-black text-base">${esc(u)}</button>`).join('');
  }
  let loginName = '';
  function showLoginNames() { loginName = ''; $('login-step-name').classList.remove('hidden'); $('login-step-pin').classList.add('hidden'); $('login-msg').textContent = ''; }
  function pickLoginName(name) {
    loginName = name; $('login-who').textContent = name; $('login-pin').value = '';
    $('login-step-name').classList.add('hidden'); $('login-step-pin').classList.remove('hidden'); $('login-msg').textContent = '';
    setTimeout(() => $('login-pin').focus(), 50);
  }
  async function submitLogin() {
    if (STATE.busy || !loginName) return;
    const pin = $('login-pin').value.trim();
    const msg = $('login-msg');
    if (!/^\d{4}$/.test(pin)) { msg.textContent = 'El PIN tiene 4 números.'; msg.className = 'mt-4 text-center text-sm font-bold text-red-400'; return; }
    msg.textContent = 'Entrando…'; msg.className = 'mt-4 text-center text-sm font-bold text-slate-400';
    const r = await withBusy('Entrando…', () => Api.login(loginName, pin));
    if (!r.ok) { msg.textContent = r.error || 'No se pudo entrar.'; msg.className = 'mt-4 text-center text-sm font-bold text-red-400'; $('login-pin').value = ''; $('login-pin').focus(); return; }
    STATE.token = r.token; STATE.employee = r.user;
    Store.set({ token: r.token, user: r.user, exp: Date.now() + (r.dias || 30) * 86400000 });
    showScreen('login-screen', false);
    start();
  }
  async function logout() {
    const d = manualDraft;
    if (d && (hasQty(d) || normText(d.sku)) && !(await askConfirm('Hay una carga sin guardar.\n¿Salir igual y descartarla?', 'Sí, salir', 'Volver'))) return;
    Store.clear(); STATE.token = ''; STATE.cards = []; manualDraft = null; minDraft = null; photoDrafts = [];
    showLogin();
  }

  // Carga todo desde el servidor (maestro, catálogos, proveedores y tarjetas). Devuelve true si salió bien.
  async function loadAll(first) {
    const r = await Api.cargarTodo();
    if (!r.ok) {
      if (r.code === 'AUTH') { Store.clear(); STATE.token = ''; showLogin(r.error); }
      else if (first) bootMsg(r.error || 'No se pudo cargar.', true);
      else toast(r.error || 'No se pudo actualizar.', 'error');
      return false;
    }
    if (r.user) STATE.employee = r.user;
    loadMaster(r, first);
    STATE.puedeMinimos = !!r.puedeMinimos;
    applyBrand(STATE.config.NOMBRE_NEGOCIO, STATE.config.SUCURSAL);
    setCards(r.cards);
    return true;
  }
  async function refreshAll(manual) {
    if (STATE.busy || !STATE.token) return;
    if (await withBusy('Actualizando…', () => loadAll(false))) { applyPerms(); renderDraft(manualDraft); if (minDraft) renderDraft(minDraft); renderList(); if (manual) toast('Actualizado', 'info'); }
  }
  async function refreshCards() {   // chequeo liviano en segundo plano (solo las tarjetas)
    if (STATE.busy || !STATE.token || document.hidden) return;
    const r = await Api.obtenerTarjetas();
    if (r.ok) { setCards(r.cards); renderList(); }
    else if (r.code === 'AUTH') apiFailed(r);
  }

  async function start() {
    if (!STATE.token) {
      const s = Store.get();
      if (s && s.token && s.exp > Date.now()) { STATE.token = s.token; STATE.employee = s.user; }
    }
    if (!STATE.token) { showLogin(); return; }
    bootMsg('Cargando…', false);
    if (!(await loadAll(true))) return;
    showScreen('boot-screen', false); showScreen('login-screen', false);
    $('employee-name').textContent = STATE.employee;
    $('data-source-badge').textContent = (Api.mode() === 'local' ? 'Datos de prueba' : 'Base Sheets') + (STATE.config.SUCURSAL ? ' · ' + STATE.config.SUCURSAL : '');
    manualDraft = newDraft('manual');
    minDraft = newMinDraft();
    photoDrafts = [];
    applyPerms();
    setMode('manual');
    setPanelVisible(false);   // al abrir, la Lista final es lo primero
    renderDraft(manualDraft);
    renderDraft(minDraft);
    renderPhoto();
    renderList();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && STATE.token && Date.now() - STATE.lastSync > 20000) refreshCards(); });
  setInterval(refreshCards, 90000);
  document.addEventListener('input', e => {
    if (e.target.id === 'login-pin') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); if (e.target.value.length === 4) submitLogin(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'login-pin') { e.preventDefault(); submitLogin(); } });
  // App instalable (solo cuando está alojada fuera de Apps Script)
  let installEvt = null;
  function installApp() {
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.finally(() => { installEvt = null; $('btn-install').classList.add('hidden'); });
  }
  if (!Api.isAppsScript() && /^https?:$/.test(location.protocol)) {
    [['manifest', 'manifest.webmanifest'], ['icon', 'icons/icon-192.png'], ['apple-touch-icon', 'icons/apple-touch-icon.png']].forEach(([rel, href]) => {
      const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* sin modo offline */ });
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('btn-install').classList.remove('hidden'); });
    window.addEventListener('appinstalled', () => { installEvt = null; $('btn-install').classList.add('hidden'); toast('App instalada', 'ok'); });
  }
  start();
  </script>
</body>
</html>
