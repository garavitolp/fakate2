<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>FAKATE - Gestor de Reposición</title>
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FAKATE">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              bg: '#0b0f19',
              card: '#151e2e',
              border: '#1e293b',
              accent: '#2563eb',
              input: '#0f172a',
              inputBorder: '#334155'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* ROJO: reservado SOLO para errores y datos ilegibles */
    @keyframes pulseRed {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { border-color: #f87171; box-shadow: 0 0 0 4px rgba(239,68,68,0.1); }
    }
    .field-error, .cell-error {
      background-color: #450a0a !important;
      border-color: #ef4444 !important;
      color: #fecaca !important;
      animation: pulseRed 2s infinite;
    }

    /* Grilla a pantalla completa (celular) */
    .matrix-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 100 !important;
      background-color: #0b0f19 !important;
      border-radius: 0 !important;
      border: none !important;
      overflow-y: auto !important;
      padding: 1rem !important;
      margin: 0 !important;
    }

    select option, select optgroup { background-color: #0f172a; color: #f8fafc; }
    /* Cuadro de sugerencias (SKU / proveedor): oscuro, chico, con scroll */
    .sug-box {
      position: absolute; left: 0; right: 0; z-index: 60; margin-top: 4px;
      max-height: 260px; overflow-y: auto;
      background: #1e293b; border: 1px solid #475569; border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .print-only { display: none; }

    /* Impresión A4: fondo blanco, texto negro, sin UI */
    @media print {
      @page { size: A4; margin: 12mm; }
      body { background-color: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-card {
        page-break-inside: avoid;
        border: 1px solid #bbb !important;
        background-color: white !important;
        color: black !important;
        margin-bottom: 0.75rem !important;
        box-shadow: none !important;
        padding: 0.75rem !important;
      }
      .print-text-dark, .print-card * { color: black !important; }
      .print-border { border-color: #ddd !important; }
      .print-tag { border: 1px solid #999 !important; background: transparent !important; color: black !important; }
    }
    /* Modo visor: genera imágenes 4:5 (1080×1350) para WhatsApp */
    #viewer { position: fixed; inset: 0; z-index: 250; background: #1f2937; color: #fff; overflow-y: auto; -webkit-overflow-scrolling: touch; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #viewer .vw-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: #0b0f19; border-bottom: 1px solid #1e293b; }
    #viewer .vw-btn { padding: 8px 12px; border-radius: 10px; background: #1e293b; color: #f8fafc; font-weight: 800; font-size: 14px; border: 1px solid #334155; }
    #viewer .vw-btn.on { background: #2563eb; border-color: #60a5fa; }
    #viewer .vw-send { display: flex; gap: 6px; width: 100%; }
    #viewer .vw-send .vw-btn { flex: 1; }
    #viewer .vw-go { background: #059669; border-color: #34d399; }
    #viewer .vw-size { color: #cbd5e1; font-weight: 800; font-size: 13px; min-width: 2.2em; text-align: center; }
    #viewer .vw-pages { padding: 10px 10px 40px; max-width: 560px; margin: 0 auto; }
    #viewer .vw-page { margin-bottom: 14px; }
    #viewer .vw-pnum { font-size: 12px; font-weight: 800; color: #cbd5e1; margin-bottom: 4px; }
    #viewer .vw-page img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.45); background: #fff; }
    #viewer .vw-hint { font-size: 12px; color: #94a3b8; text-align: center; padding: 4px 8px; }
  </style>
</head>
<body class="min-h-screen p-2 sm:p-4 pb-24">

  <!-- Encabezado solo para impresión -->
  <div class="print-only" style="margin-bottom:12px">
    <div style="font-size:18px;font-weight:900"><span class="brand-name">FAKATE</span> — Lista de reposición <span class="brand-branch-print"></span></div>
    <div id="print-meta" style="font-size:11px"></div>
  </div>

  <!-- ==================== HEADER ==================== -->
  <header class="no-print flex items-center justify-between gap-2 mb-3 bg-navy-card px-3 py-2 rounded-2xl border border-navy-border shadow-lg">
    <div class="flex items-center gap-1.5 min-w-0">
      <span class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-sm font-bold text-slate-100 min-w-0"><span class="text-emerald-500">●</span><span id="employee-name" class="truncate"></span></span>
      <button type="button" data-act="refresh" title="Actualizar datos" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-base font-black shrink-0">↻</button>
      <button type="button" data-act="logout" title="Cambiar de usuario" class="px-2.5 h-8 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 text-[11px] font-bold shrink-0">Salir</button>
    </div>
    <button type="button" id="btn-toggle-panel" data-act="toggle-panel" class="px-4 py-2 rounded-xl bg-green-600 hover:bg-green-500 text-white text-sm font-black shadow transition shrink-0">+ Nueva carga</button>
  </header>


  <!-- ==================== PANEL DE CARGA ==================== -->
  <div id="main-forms-container" class="no-print">
    <div class="max-w-4xl mx-auto mb-3 flex items-center bg-slate-900 rounded-xl p-1 border border-slate-800">
      <button type="button" id="btn-mode-manual" data-act="mode" data-mode="manual" class="flex-1">✍️ Carga manual</button>
      <button type="button" id="btn-mode-photo" data-act="mode" data-mode="photo" class="flex-1">📷 Foto (IA)</button>
      <button type="button" id="btn-mode-min" data-act="mode" data-mode="min" class="hidden flex-1">📏 Mínimos</button>
    </div>

    <!-- 1. CARGA MANUAL -->
    <section id="manual-mode-panel" class="bg-navy-card border border-navy-border rounded-2xl shadow-xl p-4 sm:p-6 mb-8 max-w-4xl mx-auto">
      <div id="edit-banner" class="hidden mb-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/60 text-amber-200 text-xs font-bold"></div>
      <div id="manual-editor"></div>
      <div class="mt-6 flex flex-wrap gap-3 justify-end">
        <button type="button" id="btn-cancel-edit" data-act="cancel-edit" class="hidden px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">Cancelar edición</button>
        <button type="button" id="btn-save-manual" data-act="save-manual" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-green-600 hover:bg-green-500 text-white font-black text-sm uppercase tracking-widest shadow-lg transition">Guardar producto</button>
      </div>
    </section>

    <!-- 3. DEFINIR STOCK MÍNIMO (solo Pier y Sio: Configuracion → EDITORES_MINIMOS) -->
    <section id="min-mode-panel" class="hidden bg-navy-card border border-navy-border rounded-2xl shadow-xl p-4 sm:p-6 mb-8 max-w-4xl mx-auto">
      <div id="min-editor"></div>
      <div class="mt-6 flex flex-wrap gap-3 justify-end">
        <button type="button" data-act="m-reset" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">Limpiar todo</button>
        <button type="button" data-act="m-save-next" class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-sm transition">Guardar y cargar otro parecido</button>
        <button type="button" data-act="m-save" class="px-8 py-3 rounded-xl bg-green-600 hover:bg-green-500 text-white font-black text-sm uppercase tracking-widest shadow-lg transition">Guardar producto</button>
      </div>
    </section>

    <!-- 2. FOTO (IA) -->
    <section id="photo-mode-panel" class="hidden bg-navy-card border border-navy-border rounded-2xl shadow-xl p-4 sm:p-6 mb-8 max-w-4xl mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
        <div>
          <span class="inline-block px-2 py-1 rounded bg-blue-600 text-white text-[10px] font-black uppercase tracking-widest mb-2">Modo foto IA</span>
          <h2 class="text-xl font-black text-white uppercase tracking-tight">Lectura y validación de la hoja</h2>
          <p class="text-xs text-slate-400 mt-1">Cada producto leído aparece en la misma grilla que la carga manual. Revisá, corregí y confirmá el SKU de cada uno.</p>
        </div>
        <button type="button" data-act="mode" data-mode="manual" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition">← Volver a carga manual</button>
      </div>

      <div class="flex flex-wrap gap-3 mb-6 pb-6 border-b border-navy-border">
        <input type="file" accept="image/*" capture="environment" id="camera-input" class="hidden">
        <button type="button" data-act="pick-photo" class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg transition">📸 Subir foto de la hoja</button>
        <button type="button" data-act="demo-photo" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">✨ Cargar ejemplo (3 hojas)</button>
      </div>

      <div id="ia-error-alert" class="hidden mb-6 p-4 rounded-xl bg-red-950/40 border border-red-500/50 text-red-200 text-sm font-bold"></div>
      <div id="photo-editors" class="space-y-6"></div>

      <div class="mt-8 pt-6 border-t border-navy-border text-right">
        <button type="button" id="btn-confirm-ia" data-act="confirm-photo" disabled class="px-8 py-3 rounded-xl bg-green-600 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-black text-sm uppercase tracking-widest transition">Confirmar e ingresar (0)</button>
      </div>
    </section>
  </div>

  <!-- ==================== LISTA FINAL ==================== -->
  <section id="final-list-section" class="max-w-6xl mx-auto">
    <div class="no-print bg-navy-card border border-navy-border rounded-xl p-3 mb-4 shadow-lg">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-xl font-black text-white uppercase tracking-tighter">Lista final <span id="list-count" class="text-xs font-bold text-slate-500 normal-case tracking-normal"></span></h1>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" data-act="viewer-open" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow transition">📲 Visor</button>
          <button type="button" data-act="print" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow transition">🖨 Imprimir</button>
        </div>
      </div>
      <div class="flex items-center gap-2 mt-2">
        <div class="flex items-center bg-slate-900 rounded-lg p-0.5 border border-slate-800 shrink-0">
          <button type="button" data-act="global-view" data-mode="COLOR" class="seg-global px-3 py-1.5 rounded-md text-xs font-bold transition">Por color</button>
          <button type="button" data-act="global-view" data-mode="TALLE" class="seg-global px-3 py-1.5 rounded-md text-xs font-bold transition">Por talle</button>
        </div>
        <button type="button" data-act="toggle-filters" class="sm:hidden px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300">Filtros ▾</button>
        <button type="button" id="btn-trash" data-act="toggle-trash" class="ml-auto px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-300 transition shrink-0">🗑 0</button>
      </div>
      <div id="filters-box" class="hidden sm:flex flex-wrap gap-2 mt-3">
        <select data-filter="cat" class="filter-sel"></select>
        <select data-filter="type" class="filter-sel"></select>
        <select data-filter="prov" class="filter-sel"></select>
        <select data-filter="zona" class="filter-sel"></select>
        <select data-filter="size" class="filter-sel"></select>
        <select data-filter="color" class="filter-sel"></select>
        <select data-filter="tag" class="filter-sel"></select>
        <select data-filter="by" class="filter-sel"></select>
      </div>
    </div>

    <div id="trash-container" class="hidden no-print mb-6"></div>
    <div id="cards-container" class="space-y-4"></div>
    <div id="data-source-badge" class="no-print text-center text-[10px] font-bold text-slate-600 uppercase tracking-widest mt-8"></div>
  </section>

  <!-- Pantalla de ingreso (nombre + PIN) -->
  <div id="login-screen" class="no-print hidden fixed inset-0 z-[400] bg-navy-bg flex-col items-center justify-center p-6 overflow-y-auto">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">

  <script>
  'use strict';
  /* ===========================================================================
     FAKATE — Gestor de Reposición · Frontend (Fase 1)
     Un solo archivo, sin frameworks. Los datos de prueba (MOCK) tienen la MISMA
     forma que las pestañas del Google Sheets; en la Fase 2 los trae Apps Script.
     =========================================================================== */

  /* ---------- 1. DATOS DE PRUEBA (forma del Sheet real) ---------- */
  const MOCK = {
    config: { VISTA_POR_DEFECTO: 'COLOR', DIAS_PAPELERA: 30, NOMBRE_NEGOCIO: 'FAKATE', SUCURSAL: 'Modo prueba' },          // pestaña Configuración
    usuarios: ['Abi', 'Fer', 'Emi', 'Anto', 'Sio', 'Pier'],                          // pestaña Usuarios (Activo = SI)
    categorias: ['HOMBRE', 'DAMA', 'KIDS', 'BEBE', 'LENCERIA', 'BLANQUERIA'], // pestaña Catálogos
    colores: ['BLANCO', 'NEGRO', 'MARINO', 'MELANGE', 'VERDE', 'BEIGE', 'GRIS', 'CELESTE', 'TOPO'],
    maestro: [],                                                           // pestaña Maestro de Productos (1 fila por variante)
    proveedores: [                                                         // pestaña Base de Proveedores
      { codigo: 'ROMAY', nombre: 'ROMAY', direccion: 'SALADA - PUNTA MOGOTE', zonas: 'SALADA, PUNTA MOGOTE', whatsapp: '' },
      { codigo: "DAVICO'S", nombre: "DAVICO'S", direccion: '', zonas: '', whatsapp: '' },
      { codigo: 'TRIUNFANTE', nombre: 'TRIUNFANTE', direccion: 'URKUPIÑA PASILLO 4', zonas: 'SALADA, URKUPIÑA', whatsapp: '' },
      { codigo: 'MIDWEST', nombre: 'MIDWEST', direccion: 'SALADA - OCEAN - PASILLO 7 PUESTO 117', zonas: 'SALADA, OCEAN', whatsapp: '(11) 3079 1500' },
      { codigo: 'RUBELU', nombre: 'RUBELU', direccion: 'SALADA - GALERIA IMPERIO - LOCAL 14 / FLORES - CUENCA 160', zonas: 'SALADA, FLORES', whatsapp: '(11) 5313 2829' },
      { codigo: 'L & N', nombre: 'L & N', direccion: 'SALADA - GALERIA IMPERIO - PASILLO 3 LOCAL 12', zonas: 'SALADA', whatsapp: '' },
      { codigo: "GOHITO'S", nombre: "GOHITO'S", direccion: 'SALADA - URKUPIÑA - Pasillo 11 Puesto 35', zonas: 'SALADA, URKUPIÑA', whatsapp: '' }
    ]
  };
  (function buildMockMaestro() {
    const add = (sku, nombre, categoria, color, talle, stockMinimo, proveedores) =>
      MOCK.maestro.push({ sku, nombre, categoria, color, talle: String(talle), stockMinimo, proveedores, provPred: '' });
    // Con stock mínimo, talles sin T
    ['BLANCO', 'NEGRO'].forEach(c => { for (let t = 1; t <= 10; t++) add('HREM1', 'Remeras Algodon Lisas Adulto', 'HOMBRE', c, t, 10, 'ROMAY'); });
    // Con stock mínimo distinto por color, talles con T
    const kids = [4, 6, 8, 10, 12, 14, 16];
    [['NEGRO', 5], ['MARINO', 15], ['MELANGE', 15], ['VERDE', 8]].forEach(([c, m]) =>
      kids.forEach(t => add('JOG-ROM-SF', 'Joggin Romay Recto Sin Friza Niño', 'KIDS', c, t, m, 'ROMAY')));
    [['NEGRO', 5], ['MARINO', 10], ['MELANGE', 10]].forEach(([c, m]) =>
      kids.forEach(t => add('JOG-ROM-CF', 'Joggin Romay Recto Con Friza Niño', 'KIDS', c, t, m, 'ROMAY, TRIUNFANTE')));
    // Talles definidos pero SIN stock mínimo
    ['RATA', 'TOPO', 'NEGRO', 'MARINO'].forEach(c => [38, 40, 42, 44, 46, 48].forEach(t =>
      add('PAN-REC-RUS', 'Pantalon Recto C/Cierre Algodon Rustico Hombre', 'HOMBRE', c, t, null, 'TRIUNFANTE')));
    // Producto conocido SIN variantes (la empleada define talles y formato)
    add('DAV-CARGO', 'Pantalon Jogger Cargo Davico', 'HOMBRE', '', '', null, "DAVICO'S");
  })();

  /* ---------- 2. UTILIDADES ---------- */
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  // Mayúsculas y espacios normalizados. NO quita acentos (ÚNICO sigue siendo ÚNICO).
  const normText = s => String(s ?? '').trim().toUpperCase().replace(/\s+/g, ' ');
  const stripAccents = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
  const splitList = s => String(s ?? '').split(',').map(normText).filter(Boolean);
  const key = (t, c) => t + '|' + c;
  const union = (a, b) => [...new Set([...(a || []), ...(b || [])])];
  const titleCase = s => String(s).toLowerCase().replace(/(^|[\s\/\-(])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

  // Talle guardado SIN prefijo: "T4" → "4", "Talle S" → "S"
  function normSize(s) {
    let t = normText(s).replace(/^TALLE\s*/, '');
    if (/^T\s?\d/.test(t)) t = t.replace(/^T\s?/, '');
    else if (/^T[A-ZÚ0-9]+$/.test(t) && LETTERS.includes(t.slice(1).replace('UNICO', 'ÚNICO'))) t = t.slice(1);
    if (t === 'UNICO') t = 'ÚNICO';
    return t;
  }
  const LETTERS = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', 'ÚNICO'];
  // Celda "Talle" del Maestro: un talle (8), una lista (38,40,42), un rango (4-16 x2, 1 al 10, S-XL) o TODOS.
  // Devuelve { kind: 'one' | 'range' | 'all', sizes } o null si está vacía.
  function parseSizeSpec(raw) {
    const s = normText(raw);
    if (!s) return null;
    if (s === 'TODOS' || s === 'TODAS' || s === 'TODO') return { kind: 'all', sizes: [] };
    const parts = s.split(/\s*[,;]\s*/).filter(Boolean);
    let isRange = parts.length > 1;
    const out = [];
    parts.forEach(part => {
      const r = parseSizeRange(part);
      if (r) { isRange = true; r.forEach(t => out.push(t)); } else out.push(normSize(part));
    });
    const sizes = [...new Set(out.filter(Boolean))];
    if (!sizes.length) return null;
    return { kind: isRange ? 'range' : 'one', sizes };
  }
  function parseSizeRange(part) {
    let txt = part, step = 1;
    const m = txt.match(/^(.*?)\s*(?:X|DE A|DE)\s*(\d+)(?:\s*EN\s*\d+)?$/);
    if (m && /-|\sAL?\s/.test(m[1])) { txt = m[1]; step = Math.max(1, Number(m[2])); }
    const ends = txt.split(/\s*-\s*|\s+AL?\s+/);
    if (ends.length !== 2) return null;
    const a = normSize(ends[0]), b = normSize(ends[1]);
    if (/^\d+$/.test(a) && /^\d+$/.test(b)) {
      let lo = Number(a), hi = Number(b);
      if (lo > hi) [lo, hi] = [hi, lo];
      if ((hi - lo) / step > 60) return null;
      const r = [];
      for (let t = lo; t <= hi; t += step) r.push(String(t));
      return r;
    }
    const ia = LETTERS.indexOf(a), ib = LETTERS.indexOf(b);
    if (ia >= 0 && ib >= 0) return LETTERS.slice(Math.min(ia, ib), Math.max(ia, ib) + 1);
    return null;
  }
  const SIZE_GROUPS = [
    ['Más usados', Array.from({ length: 18 }, (_, i) => String(i + 1))],
    ['Camisa / Pantalón', ['34', '36', '38', '40', '42', '44', '46', '48', '50', '52', '54', '56', '58', '60']],
    ['Letras', LETTERS]
  ];
  const CATALOG_SIZES = SIZE_GROUPS.flatMap(g => g[1]);
  function sizeRank(t) {
    if (/^0+$/.test(t) && t.length > 1) return [0, -t.length];
    if (/^\d+$/.test(t)) return [0, Number(t)];
    const i = LETTERS.indexOf(t);
    if (i >= 0) return [1, i];
    return [2, t];
  }
  // Orden VISUAL de talles (el que se usa en la grilla, en "copiar 1° fila" y en la lista)
  function sortSizes(list) {
    return [...new Set(list)].sort((a, b) => {
      const ra = sizeRank(a), rb = sizeRank(b);
      if (ra[0] !== rb[0]) return ra[0] - rb[0];
      if (ra[0] === 2) return String(ra[1]).localeCompare(String(rb[1]));
      return ra[1] - rb[1];
    });
  }
  function orderColors(list) {
    const uniq = [...new Set(list)];
    return uniq.sort((a, b) => {
      const ia = STATE.colorCatalog.indexOf(a), ib = STATE.colorCatalog.indexOf(b);
      return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
    });
  }
  // Formato único de talle: siempre con T. Se guarda sin T y se muestra con T.
  const fmtShort = t => 'T' + t;   // TODOS los talles con T (TÚNICO incluido) para no confundir talle con color   // formato único: siempre con T (T4, T40, TS). Se guarda sin T.
  const sizeLabel = t => fmtShort(t);

  function levenshtein(a, b) {
    const m = [];
    for (let i = 0; i <= b.length; i++) m[i] = [i];
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++)
      for (let j = 1; j <= a.length; j++)
        m[i][j] = b[i - 1] === a[j - 1] ? m[i - 1][j - 1] : Math.min(m[i - 1][j - 1], m[i][j - 1], m[i - 1][j]) + 1;
    return m[b.length][a.length];
  }
  function toNumOrNull(v) {
    if (v === null || v === undefined || String(v).trim() === '') return null;
    const n = Number(v);
    return isFinite(n) ? n : null;
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' +
      d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }
  // WhatsApp: número en formato local argentino → https://wa.me/549...
  function waLink(num) {
    let d = String(num || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.startsWith('00')) d = d.slice(2);
    if (d.startsWith('54')) { if (!d.startsWith('549')) d = '549' + d.slice(2); }
    else d = '549' + d.replace(/^0/, '');
    return 'https://wa.me/' + d;

  // App instalable: habla con Apps Script por internet (doPost). Content-Type text/plain = sin "preflight" CORS.

  function loadMaster(data, first = true) {
    STATE.config = Object.assign({ VISTA_POR_DEFECTO: 'COLOR', DIAS_PAPELERA: 30 }, data.config || {});

    STATE.colorCatalog = (data.colores || []).map(normText).filter(c => c !== VARIOS);

    STATE.products = {};
    (data.maestro || []).forEach(row => {
      const sku = normText(row.sku);
      if (!sku) return;
      const p = STATE.products[sku] || (STATE.products[sku] = {
        sku, nombre: String(row.nombre || '').trim() || sku, categoria: normText(row.categoria),
        proveedores: [], provPred: '', variants: [], varios: {}, sizes: [], colors: [], hasMin: false, usesRanges: false, _rows: []
      });
      splitList(row.proveedores).forEach(c => { if (!p.proveedores.includes(c)) p.proveedores.push(c); });
      if (normText(row.provPred)) p.provPred = normText(row.provPred);
      const color = normText(row.color), spec = parseSizeSpec(row.talle), min = toNumOrNull(row.stockMinimo);
      if (!color || !spec) return;
      if (color === VARIOS && min === null) return;
      p._rows.push({ color, spec, min });
    });
    // Rangos y TODOS: una fila con talle puntual le gana a un rango, y un rango le gana a TODOS.
    Object.values(STATE.products).forEach(p => {
      const known = new Set();
      p._rows.forEach(r => { if (r.spec.kind !== 'all') r.spec.sizes.forEach(t => known.add(t)); });
      const best = {};
      p._rows.forEach(r => {
        const lvl = r.spec.kind === 'one' ? 0 : r.spec.kind === 'range' ? 1 : 2;
        if (lvl) p.usesRanges = true;
        (r.spec.kind === 'all' ? [...known] : r.spec.sizes).forEach(t => {
          const k = key(t, r.color);
          if (!best[k] || lvl < best[k].lvl) best[k] = { color: r.color, talle: t, min: r.min, lvl };
        });
      });
      Object.values(best).forEach(b => {
        if (b.color === VARIOS) p.varios[b.talle] = b.min;
        else p.variants.push({ color: b.color, talle: b.talle, min: b.min });

      p.variants.forEach(v => { if (!STATE.colorCatalog.includes(v.color)) STATE.colorCatalog.push(v.color); });

  const productOf = d => (d.appliedSku && d.appliedSku === normText(d.sku)) ? (STATE.products[d.appliedSku] || null) : null;
  const hasQty = d => Object.values(d.qty).some(v => v !== '' && v !== undefined && v !== null);
  const cellState = raw => (raw === undefined || raw === null || raw === '') ? 'blank' : (typeof raw === 'number' ? 'num' : 'invalid');

  // Aplica los datos del Maestro al SKU escrito. Devuelve true si cambió el producto.
  function applySku(d) {
    const sku = normText(d.sku);
    d.sku = sku;
    if (sku === d.appliedSku) return false;
    const prevP = STATE.products[d.appliedSku] || null;
    const newP = STATE.products[sku] || null;
    d.appliedSku = sku;
    if (prevP === newP) return false;
    if (prevP) {
      if (d.productName === prevP.nombre) d.productName = d.readName ? titleCase(d.readName) : '';
      if (prevP.variants.length) {
        if (!hasQty(d)) { d.sizes = []; d.colors = []; }
      }
    }
    if (newP) {
      d.productName = newP.nombre;
      if (newP.categoria) d.category = newP.categoria;
      if (!d.provider && newP.provPred) d.provider = newP.provPred;
      if (newP.variants.length) {
        if (!hasQty(d)) { d.sizes = [...newP.sizes]; d.colors = [...newP.colors]; }
        else { d.sizes = union(d.sizes, newP.sizes); d.colors = union(d.colors, newP.colors); }
      }
    }
    return true;
  }

  // Calcula lo que se guardaría. Todo en datos estructurados {talle, color, qty}.
  function computeResult(d) {
    const p = productOf(d);
    const minMap = {};
    if (p) p.variants.forEach(v => { if (v.min !== null) minMap[key(v.talle, v.color)] = v; });
    const varios = (p && p.varios) || {};
    const hasMin = Object.keys(minMap).length > 0 || Object.keys(varios).length > 0;
    const sizes = sortSizes(d.sizes), colors = orderColors(d.colors);
    const entered = [];
    let invalid = 0;
    sizes.forEach(t => colors.forEach(c => {
      const raw = d.qty[key(t, c)], st = cellState(raw);
      if (st === 'invalid') invalid++;
      else if (st === 'num' && raw > 0) entered.push({ talle: t, color: c, qty: raw });
    }));

    let counted = null, falta = null, blanks = 0;
    if (d.listType === 'FALTA') {
      falta = entered; // carga directa: se ignoran los mínimos
    } else {
      counted = entered.slice();
      if (hasMin) {
        falta = [];
        const proc = (talle, color, min) => {
          const k = key(talle, color);
          const inGrid = d.sizes.includes(talle) && d.colors.includes(color);
          const raw = inGrid ? d.qty[k] : undefined, st = cellState(raw);
          if (st === 'invalid') return;
          let q = 0;
          if (st === 'num') q = raw; else blanks++;      // vacía = 0 (con aviso)
          if (q === 0) counted.push({ talle, color, qty: 0 });
          const f = min - q;
          if (f > 0) falta.push({ talle, color, qty: f });
        };
        Object.values(minMap).forEach(v => proc(v.talle, v.color, v.min));
        // VARIOS: cada color de la grilla que no tiene mínimo propio usa el mínimo "VARIOS" de ese talle
        sizes.forEach(t => {
          if (varios[t] === undefined) return;
          colors.forEach(c => { if (!minMap[key(t, c)]) proc(t, c, varios[t]); });
        });
      }
    }
    const units = entered.reduce((s, e) => s + e.qty, 0);
    return { counted, falta, blanks, invalid, hasMin, entered: entered.length, units };
  }

  function validateDraft(d) {
    const fe = [], msgs = [];
    if (!d.listType) { fe.push('listType'); msgs.push('Elegí el tipo de lista (STOCK o FALTA).'); }
    if (!d.category) { fe.push('category'); msgs.push('Elegí la categoría.'); }
    if (!normText(d.sku)) { fe.push('sku'); msgs.push('Falta el SKU.'); }
    else if (d.origin === 'foto' && !d.skuConfirmed) { fe.push('sku'); msgs.push('Confirmá que el SKU es el correcto.'); }
    const r = computeResult(d);
    if (r.invalid > 0) { fe.push('grid'); msgs.push(`Hay ${r.invalid} celda(s) ilegibles o no numéricas (en rojo).`); }
    if (r.entered === 0 && !(d.listType === 'STOCK' && r.hasMin)) { fe.push('grid'); msgs.push('Elegí talles y colores y cargá al menos una cantidad mayor a 0.'); }
    return { ok: msgs.length === 0, fieldErrors: fe, messages: msgs, result: r };
  }

  // Sugerencia de SKU para la foto: compara el nombre leído con el Maestro y con cargas anteriores.
  // NUNCA se aplica sola: la empleada tiene que confirmarla.
  const STOP = new Set(['DE', 'CON', 'C', 'F', 'LA', 'EL', 'Y', 'EN']);
  const tokens = s => stripAccents(normText(s)).replace(/[^A-Z0-9 ]/g, ' ').split(' ').filter(w => w.length > 1 && !STOP.has(w));
  function suggestSku(name) {
    const a = new Set(tokens(name));
    if (!a.size) return null;
    const cands = Object.values(STATE.products).map(p => ({ sku: p.sku, nombre: p.nombre, from: 'Maestro' }));
    STATE.cards.forEach(c => { if (c.readName) cands.push({ sku: c.sku, nombre: c.readName, from: 'carga anterior' }); });
    let best = null;
    cands.forEach(c => {
      const b = new Set(tokens(c.nombre));
      let inter = 0;
      a.forEach(w => { if (b.has(w)) inter++; });
      const score = inter / (a.size + b.size - inter);
      if (!best || score > best.score) best = Object.assign({ score }, c);
    });
    return best && best.score >= 0.34 ? best : null;
  }

  function activeCardsWithSku(sku, exceptId) {

  /* Sugerencias acotadas: solo aparecen al escribir y nunca más de 8.
     Pensado para miles de productos (no se listan todos). */
  const MAX_SUG = 8;
  function searchProducts(q, withExact) {
    q = normText(q);
    if (q.length < 2) return [];
    const words = tokens(q);
    const starts = [], contains = [], byName = [];
    for (const p of Object.values(STATE.products)) {
      if (p.sku === q && !withExact) continue;
      if (p.sku.startsWith(q)) starts.push(p);
      else if (p.sku.includes(q)) contains.push(p);
      else if (words.length) { const n = tokens(p.nombre); if (words.every(w => n.some(x => x.startsWith(w)))) byName.push(p); }
      if (starts.length >= MAX_SUG) break;
    }
    return starts.concat(contains, byName).slice(0, MAX_SUG);
  }
  function searchProviders(q) {
    q = normText(q);
    if (!q) return [];
    return Object.values(STATE.providers)
      .filter(p => p.code !== q && (p.code.includes(q) || normText(p.nombre).includes(q)))
      .sort((a, b) => (b.code.startsWith(q) ? 1 : 0) - (a.code.startsWith(q) ? 1 : 0))
      .slice(0, MAX_SUG);
  }
  function sugListHtml(items, act, dId) {

  function provInfoHtml(raw) {
    const code = normText(raw);
    if (!code) return '';
    const p = STATE.providers[code];
    if (!p) return `<div class="text-[11px] text-slate-400">No está en la Base de Proveedores: se guarda tal cual lo escribiste.</div>`;
    const wa = waLink(p.whatsapp);
    return `<div class="p-2 rounded-lg bg-slate-900 border border-slate-700 text-[11px] text-slate-300">
      <b class="text-white">${esc(p.nombre)}</b>${p.direccion ? ' — ' + esc(p.direccion) : ''}${p.zonas.length ? ` <span class="text-slate-500">[${esc(p.zonas.join(', '))}]</span>` : ''}
      ${wa ? `<a href="${esc(wa)}" target="_blank" rel="noopener" class="ml-1 inline-flex px-2 py-0.5 rounded-md bg-slate-800 border border-slate-600 text-slate-100">💬 WhatsApp</a>` : ''}</div>`;
  }

  function skuInfoHtml(d) {
    const sku = normText(d.sku), p = productOf(d);
    let h = '';
    const pending = sku && sku !== d.appliedSku;
    if (d.origin === 'foto') {
      if (d.skuConfirmed) {
        h += `<div class="text-[11px] font-bold text-emerald-300 mb-1">✓ SKU confirmado</div>`;
      } else {
        h += `<div class="p-2.5 rounded-lg bg-blue-950/60 border border-blue-700 text-[11px] text-blue-100 mb-1.5 space-y-1.5">`;
        if (d.readName) h += `<div>Leído en la hoja: <b>“${esc(titleCase(d.readName))}”</b></div>`;
        const s = d.skuSuggestion;
        if (s && s.sku !== sku) {
          h += `<div>Sugerencia (${esc(s.from)}): <b>${esc(s.sku)}</b> — ${esc(s.nombre)}</div>
                <button type="button" data-act="sku-accept" data-d="${d.id}" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-black">Sí, es ${esc(s.sku)}</button>
                <div class="text-blue-300/80">Si no es ese, escribí o elegí otro SKU arriba.</div>`;
        } else if (!s && !sku) {
          h += `<div>No encontré un SKU parecido. Escribí o elegí el SKU arriba.</div>`;
        }
        if (sku) h += `<button type="button" data-act="sku-confirm" data-d="${d.id}" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-black">✓ Confirmar SKU ${esc(sku)}</button>`;
        h += `</div>`;
      }
    }
    if (pending) {
      h += `<div class="text-[11px] text-slate-400">Tocá una sugerencia o presioná Enter para buscar el SKU.</div>`;
    } else if (sku) {
      let b;
      if (p && p.hasMin) b = `<span class="${C.badge} bg-emerald-900/40 border-emerald-600 text-emerald-300">✓ Con stock mínimo</span>`;
      else if (p && p.variants.length) b = `<span class="${C.badge} bg-slate-800 border-slate-600 text-slate-300">Talles definidos · sin stock mínimo</span>`;
      else if (p) b = `<span class="${C.badge} bg-amber-500/10 border-amber-500 text-amber-300">Sin talles en el Maestro: definilos abajo</span>`;
      else b = `<span class="${C.badge} bg-amber-500/10 border-amber-500 text-amber-300">Producto nuevo: definí talles y formato</span>`;
      h += `<div class="flex flex-wrap gap-1">${b}</div>`;
      const dups = activeCardsWithSku(sku, d.editingCardId);
      if (dups.length) h += `<div class="mt-1 text-[11px] text-amber-300">⚠ Ya cargado: ${dups.map(c => esc(c.hechaPor) + ' (' + esc(fmtDate(c.createdAt)) + ')').join(' · ')}</div>`;
    }
    return h;
  }

  function errorsHtml(d) {
    const show = d.origin === 'foto' || d.showErrors;
    if (!show) return '';
    const v = validateDraft(d);
    if (v.ok) return '';
    return `<div class="mb-4 p-3 rounded-xl bg-red-950/40 border border-red-500/50 text-red-200 text-xs font-bold space-y-0.5">${v.messages.map(m => '<div>• ' + esc(m) + '</div>').join('')}</div>`;
  }

  function editorHtml(d) {
    const p = productOf(d);
    const v = validateDraft(d);
    const show = d.origin === 'foto' || d.showErrors;
    const bad = f => (show && v.fieldErrors.includes(f)) ? ' field-error' : '';
    let h = '';

    if (d.origin === 'foto') {
      h += `<div class="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-800">
        <span class="text-slate-400 text-xs font-bold">📄 ${esc(d.sourceLabel)}</span>
        <button type="button" data-act="discard-draft" data-d="${d.id}" class="${C.ghostBtn}">Descartar este producto</button></div>`;
    }
    h += `<div id="${d.id}-errors">${errorsHtml(d)}</div>`;

    // Tipo de lista (botones: los desplegables nativos se ven blancos en Android)
    const segBtn = (f, v, label, onCls) => `<button type="button" data-act="set-field" data-d="${d.id}" data-f="${f}" data-v="${esc(v)}" class="flex-1 px-3 py-2.5 rounded-lg text-sm font-black transition border ${d[f] === v ? onCls : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-white'}">${label}</button>`;
    h += `<div class="mb-3"><label class="${C.label}">Tipo de lista</label>
      <div class="flex gap-2 p-1 rounded-xl border ${bad('listType') ? 'field-error' : 'border-transparent'}">
        ${segBtn('listType', 'STOCK', '🟣 STOCK · lo que hay', 'bg-purple-900/50 text-purple-200 border-purple-500')}
        ${segBtn('listType', 'FALTA', '🟢 FALTA · hay que traer', 'bg-emerald-900/50 text-emerald-200 border-emerald-500')}
      </div></div>`;

    // Categoría (chips)
    h += `<div class="mb-3"><label class="${C.label}">Categoría</label>
      <div class="flex flex-wrap gap-1.5 p-1 rounded-xl border ${bad('category') ? 'field-error' : 'border-transparent'}">
        ${union(STATE.categories, d.category ? [d.category] : []).map(c => `<button type="button" data-act="set-field" data-d="${d.id}" data-f="category" data-v="${esc(c)}" class="${C.chip} ${d.category === c ? C.sizeOn : C.chipOff}">${esc(c)}</button>`).join('')}
      </div></div>`;

    // SKU + producto
    h += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
      <div class="relative"><label class="${C.label}">SKU</label>
        <input id="${d.id}-sku" data-field="sku" data-d="${d.id}" data-sugbox="${d.id}-skusug" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(d.sku)}" placeholder="Escribí el SKU o parte del nombre" class="${C.input} uppercase${bad('sku')}">
        <div id="${d.id}-skusug" class="sug-box hidden"></div>
        <div id="${d.id}-skuinfo" class="mt-1.5">${skuInfoHtml(d)}</div>
      </div>
      <div><label class="${C.label}">Producto</label>
        ${p ? `<div class="${C.input} opacity-80">${esc(p.nombre)}</div><div class="text-[10px] text-slate-500 mt-1">Nombre tomado del Maestro.</div>`
            : `<input id="${d.id}-productName" data-field="productName" data-d="${d.id}" value="${esc(d.productName)}" placeholder="Ej: Remera Lisa Algodón Niño" class="${C.input}">`}
      </div>
    </div>`;

    // Quién hizo el conteo/lista (chips) + proveedor (texto libre)
    const users = union(union(STATE.users, STATE.extraNames), d.hechaPor ? [d.hechaPor] : []);
    const whoLabel = d.origin === 'foto' ? 'Lista física hecha por' : 'Conteo físico hecho por';
    h += `<div class="mb-3"><label class="${C.label}">${whoLabel}</label>
      <div class="flex flex-wrap gap-1.5">${users.map(u => `<button type="button" data-act="set-field" data-d="${d.id}" data-f="hechaPor" data-v="${esc(u)}" class="${C.chip} ${d.hechaPor === u ? C.sizeOn : C.chipOff}">${esc(u)}</button>`).join('')}
        ${d.askOther ? '' : `<button type="button" data-act="other-open" data-d="${d.id}" class="${C.chip} bg-transparent text-slate-300 border-dashed border-slate-500 hover:bg-slate-800">+ Otra persona</button>`}</div>
      ${d.askOther ? `<div class="flex gap-2 max-w-sm mt-2">
        <input id="${d.id}-otherin" data-enter="other-add" data-d="${d.id}" autocomplete="off" autocapitalize="words" placeholder="Nombre de la persona…" class="${C.smallInput} normal-case">
        <button type="button" data-act="other-add" data-d="${d.id}" class="${C.smallBtn}">Añadir</button>
        <button type="button" data-act="other-cancel" data-d="${d.id}" class="${C.ghostBtn}">✕</button></div>` : ''}
    </div>`;

    const own = p ? p.proveedores : [];
    h += `<div class="mb-3">
      <div class="relative max-w-md"><label class="${C.label}">Proveedor de esta compra (opcional)</label>
        <input id="${d.id}-provider" data-field="provider" data-d="${d.id}" data-sugbox="${d.id}-provsug" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(d.provider)}" placeholder="Código o nombre, libre" class="${C.input} uppercase">
        <div id="${d.id}-provsug" class="sug-box hidden"></div>
        ${own.length ? `<div class="flex flex-wrap items-center gap-1.5 mt-1.5"><span class="text-[10px] font-bold text-slate-500 uppercase">De este producto:</span>${own.map(c => `<button type="button" data-act="pick-prov" data-d="${d.id}" data-v="${esc(c)}" class="px-2 py-1 rounded-md bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] font-bold text-slate-200">${esc(c)}${p.provPred === c ? ' ★' : ''}</button>`).join('')}</div>` : ''}
        <div id="${d.id}-provinfo" class="mt-1.5">${provInfoHtml(d.provider)}</div>
      </div>
    </div>`;

    // Etiquetas + comentario
    h += `<div class="mb-3 bg-slate-900/50 border border-navy-border rounded-xl p-3">
      <label class="${C.label}">Etiquetas (opcional, ej: URGENTE)</label>
      <div class="flex gap-2 max-w-md">
        <input id="${d.id}-tagin" data-enter="add-tag" data-d="${d.id}" placeholder="NUEVA ETIQUETA…" class="${C.smallInput}">
        <button type="button" data-act="add-tag" data-d="${d.id}" class="px-4 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-xs font-black uppercase transition shrink-0">Añadir</button>
      </div>
      ${d.tags.length ? `<div class="flex flex-wrap gap-2 mt-2">${d.tags.map(t => `<button type="button" data-act="rm-tag" data-d="${d.id}" data-v="${esc(t)}" class="px-3 py-1 rounded-lg text-[10px] font-black uppercase border bg-amber-900/50 text-amber-400 border-amber-600/50 hover:bg-amber-900">#${esc(t)} ✕</button>`).join('')}</div>` : ''}
    </div>
    <input id="${d.id}-comment" data-field="comment" data-d="${d.id}" value="${esc(d.comment)}" placeholder="Nota o comentario (opcional)…" class="w-full bg-slate-900 border border-navy-inputBorder rounded-lg px-4 py-2 text-xs italic text-slate-300 focus:outline-none focus:border-navy-accent placeholder-slate-600 mb-4">`;

    // Variantes
    h += `<div class="p-3 sm:p-4 bg-navy-input border border-navy-inputBorder rounded-xl">
      <div class="flex items-center justify-between gap-2 mb-4">
        <h3 class="text-xs font-black uppercase text-white tracking-widest flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-navy-accent"></span>Variantes del producto</h3>
        ${d.origin === 'manual' ? `<button type="button" data-act="repeat-last" data-d="${d.id}" class="${C.ghostBtn}">↺ Repetir última estructura</button>` : ''}
      </div>
      ${sizesHtml(d, p)}
      ${colorsHtml(d)}
      ${gridHtml(d, p)}
    </div>`;
    return h;
  }

  function sizesHtml(d, p) {
    const chip = t => `<button type="button" data-act="toggle-size" data-d="${d.id}" data-v="${esc(t)}" class="${C.chip} ${d.sizes.includes(t) ? C.sizeOn : C.chipOff}">${esc(fmtShort(t))}</button>`;
    let groups;
    if (p && p.variants.length) groups = [['Talles del producto (Maestro)', sortSizes(union(p.sizes, d.sizes))]];
    else {
      groups = SIZE_GROUPS.map(g => [g[0], g[1]]);
      const extra = sortSizes(d.sizes.filter(t => !CATALOG_SIZES.includes(t)));
      if (extra.length) groups.push(['Otros', extra]);
    }
    return `<div class="mb-5">
      <div class="flex items-center gap-2 mb-2"><span class="${C.stepNum}">1</span><span class="text-xs font-bold uppercase text-slate-400">Elegir talles</span></div>
      ${groups.map(g => `<div class="mb-2"><div class="text-[10px] font-bold text-slate-500 uppercase mb-1">${esc(g[0])}</div><div class="flex flex-wrap gap-1.5">${g[1].map(chip).join('')}</div></div>`).join('')}
      <div class="flex gap-2 max-w-sm mt-2">
        <input id="${d.id}-sizein" data-enter="add-size" data-d="${d.id}" placeholder="OTRO TALLE…" class="${C.smallInput}">
        <button type="button" data-act="add-size" data-d="${d.id}" class="${C.smallBtn}">Añadir</button>
      </div>
    </div>`;
  }

  function colorsHtml(d) {
    const all = orderColors(union(STATE.colorCatalog, d.colors));
    const pc = d.pendingColor;
    return `<div class="mb-5">
      <div class="flex items-center gap-2 mb-2"><span class="${C.stepNum}">2</span><span class="text-xs font-bold uppercase text-slate-400">Elegir colores</span></div>
      <div class="flex flex-wrap gap-1.5 mb-2">${all.map(c => `<button type="button" data-act="toggle-color" data-d="${d.id}" data-v="${esc(c)}" class="${C.chip} ${d.colors.includes(c) ? C.colorOn : C.chipOff}">${esc(c)}</button>`).join('')}</div>
      <div class="flex gap-2 max-w-sm">
        <input id="${d.id}-colorin" data-enter="add-color" data-d="${d.id}" placeholder="OTRO COLOR…" class="${C.smallInput}">
        <button type="button" data-act="add-color" data-d="${d.id}" class="${C.smallBtn}">Añadir</button>
      </div>
      ${pc ? `<div class="mt-2 max-w-sm p-2 rounded-lg bg-blue-950/90 border border-blue-500 text-xs">
          <p class="text-blue-100 font-bold mb-1.5">¿Quisiste decir ${esc(pc.similar)}?</p>
          <div class="flex gap-2">
            <button type="button" data-act="color-sim-yes" data-d="${d.id}" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded py-1 font-bold">Sí, usar ${esc(pc.similar)}</button>
            <button type="button" data-act="color-sim-no" data-d="${d.id}" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded py-1 font-bold">No, crear “${esc(pc.value)}”</button>
          </div></div>` : ''}
    </div>`;
  }

  function gridHtml(d, p) {
    const sizes = sortSizes(d.sizes), colors = orderColors(d.colors);
    const minMap = {};
    if (p) p.variants.forEach(v => { if (v.min !== null) minMap[key(v.talle, v.color)] = v.min; });
    const varios = (p && p.varios) || {};
    const hasMin = Object.keys(minMap).length > 0 || Object.keys(varios).length > 0;
    let h = `<div id="${d.id}-gridwrap" class="${d.fullscreen ? 'matrix-fullscreen' : 'bg-slate-900/65 border border-navy-border rounded-2xl p-3 sm:p-4'} space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2"><span class="${C.stepNum}">3</span>
          <div><span class="block text-xs font-extrabold uppercase tracking-wider text-slate-200">Grilla de cantidades</span>
          <span class="block text-[11px] text-slate-400">Vacías o en 0 no se guardan${hasMin ? ' · en variantes con mínimo, vacía = 0' : ''}. “-” = 0.</span></div></div>
        <button type="button" data-act="fullscreen" data-d="${d.id}" class="px-3 py-1.5 rounded-lg ${d.fullscreen ? 'bg-slate-700 hover:bg-slate-600' : 'bg-blue-600 hover:bg-blue-500'} text-white font-bold text-xs shadow transition shrink-0">${d.fullscreen ? '✕ Cerrar ampliado' : '⛶ Ampliar'}</button>
      </div>`;
    if (!sizes.length || !colors.length) {
      h += `<div class="p-4 text-center text-slate-500 text-xs italic">Elegí al menos 1 talle y 1 color para habilitar la grilla.</div>`;
    } else {
      h += `<div class="flex flex-wrap items-center gap-2">
          <div class="flex items-center bg-navy-input border border-navy-inputBorder rounded-lg p-0.5">
            <span class="text-[10px] font-bold uppercase text-slate-400 px-1.5">N:</span>
            <button type="button" data-act="quickn" data-d="${d.id}" data-delta="-1" class="${C.stepBtn}">−</button>
            <input id="${d.id}-n" data-field="quickN" data-d="${d.id}" type="text" inputmode="numeric" value="${esc(d.quickN)}" class="w-10 bg-transparent px-1 py-1 text-sm font-extrabold text-center text-white focus:outline-none">
            <button type="button" data-act="quickn" data-d="${d.id}" data-delta="1" class="${C.stepBtn}">+</button>
          </div>
          <button type="button" data-act="copy-first-row" data-d="${d.id}" class="px-3 py-2 rounded-lg bg-blue-950/90 hover:bg-blue-900 border border-blue-700/70 text-[11px] font-bold text-blue-300 transition">📋 Copiar 1° fila a todos los talles</button>
          <button type="button" data-act="clear-grid" data-d="${d.id}" class="${C.ghostBtn} ml-auto">🧹 Limpiar cantidades</button>
        </div>
        <div class="overflow-x-auto rounded-xl border border-navy-border">
          <table class="w-full text-left border-collapse">
            <thead><tr>
              <th class="p-2 border-b border-navy-border sticky left-0 z-20 bg-slate-900 min-w-[84px]"><span class="text-[10px] font-bold uppercase text-slate-500">Talle \\ Color</span></th>
              ${colors.map(c => `<th class="p-2 text-center border-b border-l border-navy-border min-w-[112px] bg-slate-900/90">
                <div class="flex flex-col items-center gap-1"><span class="text-xs font-black uppercase text-white">${esc(c)}</span>
                <button type="button" data-act="fill-col" data-d="${d.id}" data-c="${esc(c)}" class="text-[9px] font-bold text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded">↓ Columna = N</button></div></th>`).join('')}
            </tr></thead>
            <tbody>${sizes.map((t, i) => `<tr>
              <td class="p-2 border-b border-navy-border bg-slate-900 sticky left-0 z-10">
                <div class="flex items-center justify-between gap-1.5"><span class="px-2.5 py-1 rounded-lg bg-navy-accent text-white text-xs font-black">${esc(fmtShort(t))}</span>
                <button type="button" data-act="fill-row" data-d="${d.id}" data-t="${esc(t)}" class="text-[9px] font-bold text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded leading-tight">→ Fila<br>= N</button></div></td>
              ${colors.map((c, j) => {
                const k = key(t, c), raw = d.qty[k], isVar = minMap[k] === undefined && varios[t] !== undefined, m = isVar ? varios[t] : minMap[k];
                return `<td class="p-1.5 border-b border-l border-navy-border text-center">
                  <div class="flex items-center justify-center gap-1">
                    <button type="button" data-act="step" data-d="${d.id}" data-t="${esc(t)}" data-c="${esc(c)}" data-delta="-1" class="${C.stepBtn}">−</button>
                    <input type="text" inputmode="numeric" autocomplete="off" id="${d.id}-cell-${i}-${j}" data-cell="1" data-d="${d.id}" data-t="${esc(t)}" data-c="${esc(c)}" value="${esc(raw ?? '')}" placeholder="${m !== undefined ? '0' : '·'}" class="${cellClass(raw)}">
                    <button type="button" data-act="step" data-d="${d.id}" data-t="${esc(t)}" data-c="${esc(c)}" data-delta="1" class="${C.stepBtn}">+</button>
                  </div>${m !== undefined ? `<div class="text-[9px] text-slate-500 mt-0.5">mín ${esc(m)}${isVar ? ' · varios' : ''}</div>` : ''}</td>`;
              }).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }
    h += `<div id="${d.id}-preview">${previewHtml(d)}</div></div>`;
    return h;
  }

  function linesListHtml(lines, cls = '') {
    return lines.map(l => `<div class="${cls}"><span class="font-black text-white print-text-dark">${esc(l.label)}:</span> ${esc(l.text)}</div>`).join('');
  }

  function previewHtml(d) {
    const r = computeResult(d);
    const counted = (r.counted || []).filter(e => e.qty > 0);
    if (!counted.length && !(r.falta && r.falta.length) && !r.blanks) return '';
    let h = `<div class="mt-1 p-3 bg-slate-950/60 border border-slate-700 rounded-xl text-xs space-y-3">
      <div class="flex justify-between text-[10px] font-black uppercase tracking-widest text-slate-400"><span>Vista previa</span><span>${r.entered} variante(s) · ${r.units} u.</span></div>`;
    if (d.listType !== 'FALTA' && counted.length)
      h += `<div><div class="text-[10px] font-black uppercase tracking-widest text-purple-300 mb-1">Contado (stock)</div><div class="font-mono text-slate-200 leading-relaxed">${linesListHtml(formatLines(counted, 'COLOR'))}</div></div>`;
    if (r.falta) {
      const title = d.listType === 'FALTA' ? 'Falta (carga directa)' : 'Faltante calculado (mínimo − contado)';
      h += `<div><div class="text-[10px] font-black uppercase tracking-widest text-emerald-300 mb-1">${title}</div>
        <div class="font-mono text-slate-200 leading-relaxed">${r.falta.length ? linesListHtml(formatLines(r.falta, 'COLOR')) : '<span class="text-slate-400 italic">Nada para reponer: todo está en el mínimo o por encima.</span>'}</div></div>`;
    }
    if (r.blanks) h += `<div class="text-amber-300 font-bold">⚠ ${r.blanks} variante(s) con stock mínimo sin cargar: se toman como 0.</div>`;
    return h + '</div>';
  }

  // Texto final con la estructura de siempre: "Negro: T4 (3), T6 (3)" o "Talle S: Blanco (6), Marino (4)"
  function formatLines(entries, mode) {
    const pos = (entries || []).filter(e => e.qty > 0);
    const q = {};
    pos.forEach(e => { q[key(e.talle, e.color)] = e.qty; });
    const out = [];
    if (mode === 'TALLE') {
      sortSizes(pos.map(e => e.talle)).forEach(t => {
        const items = orderColors(pos.filter(e => e.talle === t).map(e => e.color)).map(c => `${titleCase(c)} (${q[key(t, c)]})`);
        out.push({ label: sizeLabel(t), text: items.join(', ') });
      });
    } else {
      orderColors(pos.map(e => e.color)).forEach(c => {
        const items = sortSizes(pos.filter(e => e.color === c).map(e => e.talle)).map(t => `${fmtShort(t)} (${q[key(t, c)]})`);
        out.push({ label: titleCase(c), text: items.join(', ') });
      });
    }
    return out;
  }

  // Re-render de un editor conservando el foco y la posición del cursor
  function renderDraft(d) {
    const ae = document.activeElement;
    const focusId = ae && ae.id ? ae.id : null;
    let pos = null;
    try { pos = ae.selectionStart; } catch (e) { pos = null; }
    const target = d.origin === 'manual' ? $('manual-editor') : d.origin === 'min' ? $('min-editor') : $('editor-' + d.id);
    if (!target) return;
    target.innerHTML = d.origin === 'min' ? minEditorHtml(d) : editorHtml(d);
    if (d.origin === 'manual') renderManualChrome(); else if (d.origin === 'foto') updatePhotoConfirm();
    syncBodyScroll();
    if (focusId) {
      const el = $(focusId);
      if (el && target.contains(el)) {
        el.focus();
        try { if (pos !== null && pos !== undefined) el.setSelectionRange(pos, pos); } catch (e) { /* select */ }
      }
    }
  }
  // Actualización liviana (sin tocar la grilla): vista previa, errores, botón de confirmar
  function updateLive(d) {
    if (d.origin === 'min') { const pm = $(d.id + '-preview'); if (pm) pm.innerHTML = minSummaryHtml(d); return; }
    const pv = $(d.id + '-preview'); if (pv) pv.innerHTML = previewHtml(d);
    const er = $(d.id + '-errors'); if (er) er.innerHTML = errorsHtml(d);
    if (d.origin === 'foto') updatePhotoConfirm();
  }
  function syncBodyScroll() {
    const any = [manualDraft, minDraft, ...photoDrafts].some(d => d && d.fullscreen);
    document.body.style.overflow = any ? 'hidden' : '';
  }
  function renderManualChrome() {
    const d = manualDraft;
    const editing = d.editingCardId ? STATE.cards.find(c => c.id === d.editingCardId) : null;
    $('edit-banner').classList.toggle('hidden', !editing);
    if (editing) $('edit-banner').textContent = `✏️ Editando la tarjeta de ${editing.sku} (hecha por ${editing.hechaPor}, ${fmtDate(editing.createdAt)}). Se reemplaza recién al guardar.`;
    $('btn-cancel-edit').classList.toggle('hidden', !editing);
    $('btn-save-manual').textContent = editing ? 'Guardar cambios' : 'Guardar producto';
  }

  function renderPhoto() {
    const box = $('photo-editors');
    if (!photoDrafts.length) {
      box.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm italic">Subí una foto o cargá el ejemplo para ver los resultados acá.</div>`;
    } else {
      box.innerHTML = photoDrafts.map(d => `<div class="border border-navy-border rounded-2xl bg-slate-900/50 p-4 shadow-sm"><div id="editor-${d.id}">${editorHtml(d)}</div></div>`).join('');
    }
    updatePhotoConfirm();
    syncBodyScroll();
  }
  function updatePhotoConfirm() {
    const btn = $('btn-confirm-ia'), alertBox = $('ia-error-alert');
    const bad = photoDrafts.map((d, i) => ({ i, v: validateDraft(d) })).filter(x => !x.v.ok);
    if (!photoDrafts.length) {
      btn.disabled = true; btn.textContent = 'Confirmar e ingresar (0)'; alertBox.classList.add('hidden'); return;
    }
    if (bad.length) {
      btn.disabled = true; btn.textContent = 'Corregí los errores para continuar';
      alertBox.classList.remove('hidden');
      alertBox.textContent = `Hay ${bad.length} producto(s) con datos en rojo para revisar (producto ${bad.map(x => '#' + (x.i + 1)).join(', ')}).`;
    } else {
      btn.disabled = false; btn.textContent = `Confirmar e ingresar (${photoDrafts.length})`;
      alertBox.classList.add('hidden');
    }
  }

  /* ---------- 7. ACCIONES DEL EDITOR ---------- */
  function addColorToDraft(d, raw) {
    const val = normText(raw);
    if (!val || val === VARIOS) return;
    if (d.colors.includes(val)) return;
    let similar = null, min = 99;
    for (const cat of STATE.colorCatalog) {
      const dist = levenshtein(stripAccents(val), stripAccents(cat));
      if (dist === 0) { similar = cat; min = 0; break; }
      if (dist <= 2 && dist < min) { min = dist; similar = cat; }
    }
    if (min === 0) { if (!d.colors.includes(similar)) d.colors.push(similar); d.pendingColor = null; }
    else if (similar) d.pendingColor = { value: val, similar };
    else { if (!STATE.colorCatalog.includes(val)) STATE.colorCatalog.push(val); d.colors.push(val); d.pendingColor = null; }
  }

  async function saveManual() {
    if (STATE.busy) return;
    const d = manualDraft;
    applySku(d);
    const v = validateDraft(d);
    if (!v.ok) { d.showErrors = true; renderDraft(d); toast(v.messages[0], 'error'); return; }
    if (v.result.blanks > 0) {
      const ok = await askConfirm(`${v.result.blanks} variante(s) de ${normText(d.sku)} tienen stock mínimo y quedaron en blanco.\nSe van a guardar como 0 y sumarán al faltante.\n\n¿Guardar igual?`, 'Sí, guardar', 'Volver a la grilla');
      if (!ok) return;
    }
    const old = d.editingCardId ? STATE.cards.find(c => c.id === d.editingCardId) : null;
    const card = buildCard(d, v.result, old ? old.loteId : newLoteId(), old ? old.method : 'manual');
    const res = await withBusy('Guardando…', () => Api.guardarTarjetas({ cards: [card], replaces: d.editingCardId || null }));
    if (!res.ok) { apiFailed(res, 'No se pudo guardar. Tus datos siguen en el formulario.'); return; }
    STATE.lastStructure = { sizes: [...d.sizes], colors: [...d.colors], tags: [...d.tags] };
    setCards(res.cards);
    toast(d.editingCardId ? 'Cambios guardados' : `¡${normText(d.sku)} guardado en la lista final!`);
    manualDraft = newDraft('manual');
    renderDraft(manualDraft);
    renderList();
  }

  function buildCard(d, r, loteId, method) {
    const p = productOf(d);
    const hasFalta = r.falta && r.falta.length > 0;
    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      loteId, createdAt: new Date().toISOString(),
      employee: STATE.employee, hechaPor: d.hechaPor || STATE.employee, method,
      sku: normText(d.sku), title: p ? p.nombre : (d.productName.trim() || normText(d.sku)),
      readName: d.readName || '',
      category: d.category, listType: d.listType,
      provider: normText(d.provider), tags: [...d.tags], comment: d.comment.trim(),
      counted: r.counted, falta: r.falta,
      view: (d.listType === 'FALTA' || hasFalta) ? 'FALTA' : 'STOCK',
      groupBy: null, estado: 'ACTIVA', deletedBy: '', deletedAt: ''
    };
  }

  async function confirmPhoto() {
    if (STATE.busy) return;
    photoDrafts.forEach(applySku);
    const results = photoDrafts.map(validateDraft);
    if (results.some(v => !v.ok)) { renderPhoto(); toast('Hay datos en rojo para corregir', 'error'); return; }
    const blanks = results.reduce((s, v) => s + v.result.blanks, 0);
    if (blanks > 0) {
      const ok = await askConfirm(`${blanks} variante(s) con stock mínimo quedaron en blanco.\nSe van a guardar como 0 y sumarán al faltante.\n\n¿Ingresar igual?`, 'Sí, ingresar', 'Volver a revisar');
      if (!ok) return;
    }
    const lote = newLoteId();
    const cards = photoDrafts.map((d, i) => buildCard(d, results[i].result, lote, 'foto'));
    const res = await withBusy('Guardando…', () => Api.guardarTarjetas({ cards, replaces: null }));
    if (!res.ok) { apiFailed(res, 'No se pudo guardar la lista. Tus datos siguen en pantalla.'); return; }
    setCards(res.cards);
    toast(`¡${cards.length} producto(s) agregados a la lista final!`);
    photoDrafts = [];
    renderPhoto();
    setMode('manual');
    renderList();
  }

  async function editCard(id) {
    const c = STATE.cards.find(x => x.id === id);
    if (!c) return;
    const md = manualDraft;
    if (md && md.editingCardId !== id && (hasQty(md) || normText(md.sku))) {
      const ok = await askConfirm('Hay una carga sin guardar en el formulario.\n¿Descartarla para editar esta tarjeta?', 'Sí, descartar', 'Volver');
      if (!ok) return;
    }
    const d = newDraft('manual', {
      sku: c.sku, productName: c.title, readName: c.readName, category: c.category, listType: c.listType,
      tags: [...c.tags], comment: c.comment, provider: c.provider, hechaPor: c.hechaPor,
      editingCardId: c.id
    });
    ((c.listType === 'FALTA' ? c.falta : c.counted) || []).forEach(e => {
      if (!d.sizes.includes(e.talle)) d.sizes.push(e.talle);
      if (!d.colors.includes(e.color)) d.colors.push(e.color);
      if (!STATE.colorCatalog.includes(e.color)) STATE.colorCatalog.push(e.color);
      if (e.qty > 0) d.qty[key(e.talle, e.color)] = e.qty;
    });
    applySku(d);
    manualDraft = d;
    setPanelVisible(true);
    setMode('manual');
    renderDraft(d);
    renderList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Tarjeta cargada en el formulario para editar', 'info');
  }

  /* ---------- 8. LISTA FINAL ---------- */
  function cardView(c) {
    const f = STATE.filters.type;
    if (f === 'FALTA' && c.falta) return 'FALTA';
    if (f === 'STOCK' && c.counted) return 'STOCK';
    return c.view;
  }
  const activeEntries = c => ((cardView(c) === 'FALTA' ? c.falta : c.counted) || []).filter(e => e.qty > 0);
  const cardTitle = c => (STATE.products[c.sku] && STATE.products[c.sku].nombre) || c.title;

  function cardMatches(c, f) {
    if (f.cat !== 'ALL' && c.category !== f.cat) return false;
    if (f.type === 'FALTA' && !c.falta) return false;
    if (f.type === 'STOCK' && !c.counted) return false;
    const ents = activeEntries(c);
    if (f.size !== 'ALL' && !ents.some(e => e.talle === f.size)) return false;
    if (f.color !== 'ALL' && !ents.some(e => e.color === f.color)) return false;
    if (f.tag !== 'ALL' && !c.tags.includes(f.tag)) return false;
    if (f.prov === '__NONE__' && c.provider) return false;
    if (f.prov !== 'ALL' && f.prov !== '__NONE__' && c.provider !== f.prov) return false;
    if (f.zona !== 'ALL') { const p = STATE.providers[c.provider]; if (!p || !p.zonas.includes(f.zona)) return false; }
    if (f.by !== 'ALL' && c.hechaPor !== f.by) return false;
    return true;
  }

  function setSelectOptions(name, allLabel, items) {
    const s = document.querySelector(`[data-filter="${name}"]`);
    const cur = STATE.filters[name];
    const valid = cur === 'ALL' || items.some(i => i.v === cur);
    if (!valid) STATE.filters[name] = 'ALL';
    s.innerHTML = `<option value="ALL">${esc(allLabel)}</option>` + items.map(i => `<option value="${esc(i.v)}"${sel(i.v, STATE.filters[name])}>${esc(i.l)}</option>`).join('');
    s.className = 'filter-sel bg-navy-input border rounded-lg px-2 py-1.5 text-xs font-bold focus:outline-none ' +
      (STATE.filters[name] !== 'ALL' ? 'border-blue-500 text-white' : 'border-navy-inputBorder text-slate-300');
  }

  function updateFilterOptions(active) {
    const cats = STATE.categories.filter(c => active.some(x => x.category === c)).concat([...new Set(active.map(x => x.category))].filter(c => !STATE.categories.includes(c)));
    setSelectOptions('cat', 'Todas las categorías', cats.map(c => ({ v: c, l: c })));
    setSelectOptions('type', 'Stock y falta', [{ v: 'FALTA', l: 'Solo FALTA (para comprar)' }, { v: 'STOCK', l: 'Solo STOCK (lo que hay)' }]);
    const provs = [...new Set(active.map(c => c.provider).filter(Boolean))].sort();
    const provItems = provs.map(c => ({ v: c, l: STATE.providers[c] ? STATE.providers[c].nombre : c }));
    if (active.some(c => !c.provider)) provItems.unshift({ v: '__NONE__', l: '⚠ Sin proveedor' });
    setSelectOptions('prov', 'Todos los proveedores', provItems);
    const zonas = [...new Set(active.flatMap(c => (STATE.providers[c.provider] || { zonas: [] }).zonas))].sort();
    setSelectOptions('zona', 'Todas las zonas', zonas.map(z => ({ v: z, l: z })));
    const ents = active.flatMap(activeEntries);
    setSelectOptions('size', 'Todos los talles', sortSizes(ents.map(e => e.talle)).map(t => ({ v: t, l: 'Talle ' + t })));
    setSelectOptions('color', 'Todos los colores', orderColors(ents.map(e => e.color)).map(c => ({ v: c, l: titleCase(c) })));
    setSelectOptions('tag', 'Todas las etiquetas', [...new Set(active.flatMap(c => c.tags))].sort().map(t => ({ v: t, l: '#' + t })));
    setSelectOptions('by', 'Todas las empleadas', [...new Set(active.map(c => c.hechaPor))].sort().map(u => ({ v: u, l: 'Lista de ' + u })));
  }

  function providerHtml(c) {
    if (!c.provider) return `<span class="${C.badge} bg-amber-500/15 border-amber-500 text-amber-300 print-tag">Sin proveedor</span>`;
    const p = STATE.providers[c.provider];
    if (!p) return `<span class="font-black text-white print-text-dark">${esc(c.provider)}</span> <span class="text-slate-500 normal-case">(sin datos en la Base)</span>`;
    const wa = waLink(p.whatsapp);
    return `<span class="font-black text-white print-text-dark">${esc(p.nombre)}</span>` +
      (p.direccion ? ` — <span>${esc(p.direccion)}</span>` : '') +
      (p.zonas.length ? ` <span class="text-slate-500">[${esc(p.zonas.join(', '))}]</span>` : '') +
      (wa ? ` <a href="${esc(wa)}" target="_blank" rel="noopener" class="no-print inline-flex items-center gap-1 ml-1 px-2 py-0.5 rounded-md bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 normal-case">💬 WhatsApp</a>` : '') +
      (p.whatsapp ? `<span class="print-only">Tel: ${esc(p.whatsapp)}</span>` : '');
  }

  function cardHtml(c) {
    const view = cardView(c);
    const mode = c.groupBy || STATE.viewMode;
    const lines = formatLines(activeEntries(c), mode);
    const both = c.listType === 'STOCK' && c.falta !== null;
    const editing = manualDraft && manualDraft.editingCardId === c.id;
    const typeBadge = view === 'FALTA'
      ? `<span class="${C.badge} bg-emerald-900/30 border-emerald-500 text-emerald-400 print-tag">${c.listType === 'FALTA' ? 'FALTA (hay que traer)' : 'FALTA (a reponer)'}</span>`
      : `<span class="${C.badge} bg-purple-900/30 border-purple-500 text-purple-400 print-tag">STOCK (lo que hay)</span>`;
    const toggleBtn = both && STATE.filters.type === 'ALL'
      ? `<button type="button" data-act="card-toggle" data-id="${c.id}" class="no-print px-2 py-1 rounded bg-slate-800 text-slate-400 hover:text-white text-[10px] font-bold">⇄ Ver ${view === 'FALTA' ? 'STOCK' : 'FALTA'}</button>` : '';
    const dups = activeCardsWithSku(c.sku, c.id);
    const loteSize = STATE.cards.filter(x => x.estado === 'ACTIVA' && x.loteId === c.loteId).length;
    const seg = m => `<button type="button" data-act="card-group" data-id="${c.id}" data-mode="${m}" class="px-2 py-1 rounded text-[10px] font-bold ${mode === m ? 'bg-slate-600 text-white' : 'text-slate-400 hover:text-white'}">${m === 'COLOR' ? 'Color' : 'Talle'}</button>`;
    let body;
    if (lines.length) body = `<div class="mt-3 mb-3 space-y-1 text-[13px] text-slate-300 print-text-dark">${linesListHtml(lines)}</div>`;
    else body = `<div class="mt-3 mb-3 text-xs italic text-slate-400">${view === 'FALTA' ? 'Nada para reponer: todo está en el mínimo o por encima.' : 'Sin unidades contadas.'}</div>`;

    return `<div class="print-card print-border bg-navy-card border ${editing ? 'border-amber-500' : 'border-navy-border'} rounded-2xl p-4 sm:p-5 shadow-md">
      <div class="flex justify-between items-start gap-3">
        <div class="min-w-0">
          <h3 class="text-base font-black text-white uppercase tracking-wide print-text-dark mb-2">${esc(cardTitle(c))}</h3>
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="${C.badge} bg-slate-800 border-slate-700 text-slate-400 print-tag">🏷️ ${esc(c.sku)}</span>
            ${typeBadge}
            ${c.tags.map(t => `<span class="${C.badge} bg-amber-900/30 border-amber-600/50 text-amber-400 print-tag">#${esc(t)}</span>`).join('')}
            ${editing ? `<span class="${C.badge} bg-amber-500/20 border-amber-500 text-amber-300">En edición</span>` : ''}
            ${toggleBtn}
          </div>
        </div>
        <div class="text-right flex flex-col items-end gap-1 shrink-0">
          <span class="text-[11px] font-bold text-slate-500 print-text-dark">${esc(fmtDate(c.createdAt))}</span>
          <span class="text-[10px] font-bold text-slate-300 bg-slate-900 px-2 py-0.5 rounded-full border border-slate-800 print-tag">👤 ${esc(c.hechaPor)} ${c.method === 'foto' ? '📷' : '✍️'}</span>
          ${c.employee !== c.hechaPor ? `<span class="text-[10px] text-slate-500">cargó: ${esc(c.employee)}</span>` : ''}
        </div>
      </div>
      ${dups.length ? `<div class="mt-2 text-[11px] font-bold text-amber-300 no-print">⚠ También cargado por: ${dups.map(x => esc(x.hechaPor) + ' (' + esc(fmtDate(x.createdAt)) + ')').join(' · ')}</div>` : ''}
      ${body}
      ${c.comment ? `<div class="mb-3 px-3 py-2 bg-slate-900/50 rounded-lg border border-slate-800 print-border"><span class="text-xs font-black text-slate-400">Nota:</span> <span class="text-xs italic text-slate-300">${esc(c.comment)}</span></div>` : ''}
      <div class="pt-3 border-t border-navy-border print-border flex flex-wrap items-center justify-between gap-3">
        <div class="text-[11px] font-bold text-slate-400 print-text-dark uppercase leading-relaxed min-w-0"><span class="text-slate-500">Prov:</span> ${providerHtml(c)}</div>
        <div class="flex items-center gap-2 no-print flex-wrap">
          <div class="flex items-center bg-slate-900 rounded-md p-0.5 border border-slate-800">${seg('COLOR')}${seg('TALLE')}</div>
          ${editing ? '' : `<button type="button" data-act="card-edit" data-id="${c.id}" class="px-3 py-1.5 rounded-lg border border-yellow-900/50 hover:bg-yellow-900/30 text-yellow-500 text-[10px] font-black uppercase">Editar</button>
          <button type="button" data-act="card-delete" data-id="${c.id}" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-300 text-[10px] font-black uppercase">Borrar</button>
          ${loteSize > 1 ? `<button type="button" data-act="lote-delete" data-id="${c.id}" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-400 text-[10px] font-black uppercase">Borrar carga (${loteSize})</button>` : ''}`}
        </div>
      </div>
    </div>`;
  }

  function renderList() {
    const active = STATE.cards.filter(c => c.estado === 'ACTIVA');
    const trash = STATE.cards.filter(c => c.estado === 'PAPELERA');
    $('btn-trash').textContent = `🗑 ${trash.length}`;
    $('btn-trash').title = 'Papelera';
    document.querySelectorAll('.seg-global').forEach(b => {
      b.className = 'seg-global px-3 py-1.5 rounded-md text-xs font-bold transition ' + (b.dataset.mode === STATE.viewMode ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white');
    });
    updateFilterOptions(active);
    const list = active.filter(c => cardMatches(c, STATE.filters));
    $('list-count').textContent = active.length ? `(${list.length} de ${active.length})` : '';

    const box = $('cards-container');
    if (!active.length) box.innerHTML = `<div class="text-center py-12 text-slate-600 text-sm font-bold uppercase tracking-widest">La lista final está vacía. Cargá productos arriba.</div>`;
    else if (!list.length) box.innerHTML = `<div class="text-center py-12 text-slate-600 text-sm font-bold uppercase tracking-widest">No hay resultados para los filtros elegidos.</div>`;
    else {
      const cats = STATE.categories.concat([...new Set(list.map(c => c.category))].filter(c => !STATE.categories.includes(c)));
      box.innerHTML = cats.map(cat => {
        const group = list.filter(c => c.category === cat);
        if (!group.length) return '';

  /* ---------- 8b. MODO VISOR: imágenes 4:5 (como una publicación de Instagram) para WhatsApp ---------- */

  const VIEWER_KEY = 'fakate_viewer_v1';

  } catch (e) { /* nada */ }
  function saveViewerPrefs() { try { localStorage.setItem(VIEWER_KEY, JSON.stringify({ size: VIEWER.size, group: VIEWER.group, alts: VIEWER.alts })); } catch (e) { /* nada */ } }
  const shortDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }); };
  function viewerCards() {

  function provText(code, withTel) {

  // --- Dibujo en canvas ---
  const IMG_W = 1080, IMG_H = 1350, IMG_PAD = 56;
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const fontOf = (px, w, it) => `${it ? 'italic ' : ''}${w} ${Math.round(px)}px ${FONT}`;
  let measureCtx = null;
  function mctx() { if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d'); return measureCtx; }
  // Texto con partes de distinto peso que se corta en renglones según el ancho. Devuelve renglones listos para dibujar.
  function wrapRich(segs, maxW, px) {
    const ctx = mctx(), lines = [];
    let cur = [], curW = 0;
    const push = () => { lines.push(cur); cur = []; curW = 0; };
    segs.forEach(sg => {
      ctx.font = fontOf(px * (sg.k || 1), sg.w || 400, sg.it);
      String(sg.t).split(/(\s+)/).filter(x => x !== '').forEach(word => {
        const isSp = /^\s+$/.test(word);
        let ww = ctx.measureText(word).width;
        if (isSp && !cur.length) return;
        if (!isSp && curW + ww > maxW && cur.length) { push(); }
        if (!isSp && ww > maxW) {   // palabra más larga que el renglón: se corta por letras
          let part = '';
          for (const ch of word) { if (ctx.measureText(part + ch).width > maxW && part) { cur.push(Object.assign({}, sg, { t: part, x: curW })); push(); part = ''; } part += ch; }
          word = part; ww = ctx.measureText(word).width;

  // Un "renglón" dibujable: { h, draw(ctx, x, y) }

      .concat(sub ? textRows([{ t: sub, w: 500, k: 0.74, c: '#e5e5e5' }], inner, px, 1.25) : []);
    const padY = px * 0.2, h = rows.reduce((s, r) => s + r.h, 0) + padY * 2;
    return { kind: 'group', h: h + px * 0.25, rows: [{
      h: h + px * 0.25,
      draw(ctx, x, y) {
        ctx.fillStyle = '#000'; roundRect(ctx, x, y + px * 0.15, maxW, h, px * 0.25); ctx.fill();
        let yy = y + px * 0.15 + padY; rows.forEach(r => { r.draw(ctx, x + px * 0.45, yy); yy += r.h; });

  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  // Colores de categoría: distintos del verde (FALTA) y del violeta (STOCK)
  const CAT_COLORS = { HOMBRE: '#1d4ed8', DAMA: '#be185d', KIDS: '#c2410c', BEBE: '#0e7490', LENCERIA: '#b91c1c', BLANQUERIA: '#475569' };
  const CAT_EXTRA = ['#92400e', '#1e3a8a', '#9d174d', '#3f6212', '#0f766e'];
  function catColor(cat) {
    const k = stripAccents(normText(cat));
    if (CAT_COLORS[k]) return CAT_COLORS[k];
    let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return CAT_EXTRA[h % CAT_EXTRA.length];
  }
  function cardBlock(c, withProv, px, maxW) {
    const view = cardView(c), tipo = view === 'FALTA' ? 'FALTA' : 'STOCK';
    const rows = [gapRow(px * 0.22)];
    rows.push(...textRows([{ t: cardTitle(c).toUpperCase(), w: 900, k: 1.05 }], maxW, px, 1.1));
    // Fila: [TIPO a color] fecha chica ............................ CATEGORÍA (a la derecha)
    const mk = 0.74, ctx = mctx();
    const tipoTxt = tipo === 'FALTA' ? 'FALTA' : 'STOCK';
    const tipoBg = tipo === 'FALTA' ? '#047857' : '#6d28d9';   // verde = hay que traer · violeta = lo que hay (mismos colores que la app)
    ctx.font = fontOf(px * mk, 900); const tw = ctx.measureText(tipoTxt).width;
    const fecha = shortDate(c.createdAt);
    rows.push({
      h: px * mk * 1.65,

        let fx = x + tw + px * 0.85;
        ctx.font = fontOf(px * 0.5, 600); ctx.fillStyle = '#888'; ctx.fillText(fecha, fx, base);
        fx += ctx.measureText(fecha).width + px * 0.4;
        // categoría: etiqueta a color a la derecha (un color fijo por categoría)
        let cat = c.category || '';
        if (cat) {
          ctx.font = fontOf(px * mk, 900);
          while (cat.length > 1 && ctx.measureText(cat).width + px * 0.55 > x + maxW - fx) cat = cat.slice(0, -2) + '…';
          const cw = ctx.measureText(cat).width + px * 0.55, cx = x + maxW - cw;

          ctx.fillStyle = '#fff'; ctx.fillText(cat, cx + px * 0.275, base);
        }
      }
    });
    formatLines(activeEntries(c), c.groupBy || STATE.viewMode).forEach(l => {
      rows.push(...textRows([{ t: l.label + ': ', w: 900 }, { t: l.text, w: 400 }], maxW, px, 1.2));
    });
    if (withProv) rows.push(...textRows([{ t: 'Proveedor: ', w: 800, k: 0.8 }, { t: c.provider ? provText(c.provider, true) : 'sin proveedor', w: 400, k: 0.8 }], maxW, px, 1.3));
    if (VIEWER.alts) {

      if (alts.length) rows.push(...textRows([{ t: 'También en: ', w: 800, k: 0.66, c: '#333' }, { t: alts.map(a => provText(a, false)).join(' · '), w: 400, k: 0.66, c: '#333' }], maxW, px, 1.3));
    }
    if (c.comment) rows.push(...textRows([{ t: 'Nota: ' + c.comment, w: 400, k: 0.8, it: true }], maxW, px, 1.3));
    rows.push({ h: px * 0.32, draw(ctx, x, y) { ctx.fillStyle = '#bbb'; ctx.fillRect(x, y + px * 0.2, maxW, Math.max(2, px * 0.05)); } });
